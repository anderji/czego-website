<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt – CZEGO | Český kytarový orchestr</title>
  <meta name="description" content="Kontaktujte Český kytarový orchestr CZEGO – info@czego.cz. Pro organizaci koncertů, sponzoring nebo přihlášení za člena.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://czego.cz/kontakt.html">
  <link rel="alternate" hreflang="cs" href="https://czego.cz/kontakt.html">
  <link rel="alternate" hreflang="en" href="https://czego.cz/kontakt.html">
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="https://czego.cz/kontakt.html">
  <meta property="og:title"       content="Kontakt – CZEGO | Český kytarový orchestr">
  <meta property="og:description" content="Kontaktujte Český kytarový orchestr CZEGO – info@czego.cz.">
  <meta property="og:image"       content="https://czego.cz/assets/images/og/og-default.jpg">
  <meta property="og:site_name"   content="CZEGO">
  <meta name="twitter:card"       content="summary_large_image">
  <meta name="twitter:image"      content="https://czego.cz/assets/images/og/og-default.jpg">
  <meta name="theme-color"        content="#B8251A">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ContactPage",
    "name": "Kontakt – CZEGO",
    "url": "https://czego.cz/kontakt.html",
    "isPartOf": { "@type": "WebSite", "url": "https://czego.cz" },
    "mainEntity": {
      "@type": "MusicGroup",
      "name": "CZEGO",
      "email": "info@czego.cz",
      "sameAs": [
        "https://www.facebook.com/czegocz",
        "https://open.spotify.com/artist/2Kd9Xiqasp6kTFfpBVBGKI",
        "https://www.youtube.com/@CzechGuitarOrchestra"
      ]
    }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<a class="skip-nav" href="#main-content">Přeskočit na obsah</a>

<header class="site-header" role="banner">
  <div class="container">
    <nav class="nav" aria-label="Hlavní navigace">
      <a class="nav__logo" href="index.html">CZ<span>EGO</span></a>
      <button class="nav__burger" id="nav-burger" aria-label="Otevřít menu" aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav__links" id="nav-links" role="list"></ul>
    </nav>
  </div>
</header>

<main id="main-content" tabindex="-1">

  <div class="page-header">
    <div class="container">
      <p class="eyebrow" id="ph-eyebrow"></p>
      <h1 id="ph-h1"></h1>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="two-col">

        <!-- Levý sloupec -->
        <div class="reveal">
          <p class="lead" id="contact-lead"></p>

          <p id="reasons-title" style="font-weight:500;margin-top:2rem;margin-bottom:.75rem"></p>
          <ul id="reasons-list" style="list-style:disc;padding-left:1.5rem;color:var(--text-secondary);display:flex;flex-direction:column;gap:.4rem;font-size:.95rem"></ul>

          <div style="margin-top:2.5rem">
            <a href="mailto:info@czego.cz"
               style="font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:var(--red);border-bottom:1.5px solid var(--red-tint2);padding-bottom:.3rem;display:inline-block;margin-bottom:2rem;transition:border-color .2s"
               onmouseover="this.style.borderColor='var(--red)'"
               onmouseout="this.style.borderColor='var(--red-tint2)'">
              info@czego.cz
            </a>

            <p id="social-title" style="font-size:.75rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted);margin-bottom:1rem"></p>
            <div style="display:flex;flex-direction:column;gap:.65rem">
              <a href="https://www.facebook.com/czegocz" target="_blank" rel="noopener noreferrer"
                 style="display:flex;align-items:center;gap:.75rem;color:var(--text-secondary);font-size:.9rem;transition:color .2s"
                 onmouseover="this.style.color='var(--ink)'" onmouseout="this.style.color='var(--text-secondary)'">
                <span style="width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0;display:inline-block"></span>Facebook
              </a>
              <a href="https://open.spotify.com/artist/2Kd9Xiqasp6kTFfpBVBGKI" target="_blank" rel="noopener noreferrer"
                 style="display:flex;align-items:center;gap:.75rem;color:var(--text-secondary);font-size:.9rem;transition:color .2s"
                 onmouseover="this.style.color='var(--ink)'" onmouseout="this.style.color='var(--text-secondary)'">
                <span style="width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0;display:inline-block"></span>Spotify
              </a>
              <a href="https://www.youtube.com/@CzechGuitarOrchestra" target="_blank" rel="noopener noreferrer"
                 style="display:flex;align-items:center;gap:.75rem;color:var(--text-secondary);font-size:.9rem;transition:color .2s"
                 onmouseover="this.style.color='var(--ink)'" onmouseout="this.style.color='var(--text-secondary)'">
                <span style="width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0;display:inline-block"></span>YouTube
              </a>
            </div>
          </div>
        </div>

        <!-- Pravý sloupec – sponzoři -->
        <div class="reveal reveal-delay-2">
          <div style="background:var(--cream);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:2.5rem;box-shadow:var(--shadow-sm)">
            <h2 id="sponsors-title" style="font-size:1.25rem;margin-bottom:1.5rem"></h2>
            <div style="display:flex;flex-direction:column;gap:1rem">
              <div style="display:flex;align-items:center;gap:1rem;padding:1rem;background:var(--white);border-radius:var(--r-md);box-shadow:var(--shadow-sm)">
                <div style="width:44px;height:44px;border-radius:var(--r-sm);background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0">🎵</div>
                <div>
                  <div style="font-weight:500;font-size:.9rem">ZUŠ Pstrossova</div>
                  <div style="font-size:.8rem;color:var(--text-muted)">Praha</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:1rem;padding:1rem;background:var(--white);border-radius:var(--r-md);box-shadow:var(--shadow-sm)">
                <div style="width:44px;height:44px;border-radius:var(--r-sm);background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0">🏛️</div>
                <div>
                  <div style="font-weight:500;font-size:.9rem">Magistrát hl. m. Prahy</div>
                  <div style="font-size:.8rem;color:var(--text-muted)">Praha</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:1rem;padding:1rem;background:var(--white);border-radius:var(--r-md);box-shadow:var(--shadow-sm)">
                <div style="width:44px;height:44px;border-radius:var(--r-sm);background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0">🎸</div>
                <div>
                  <div style="font-weight:500;font-size:.9rem">D'Addario</div>
                  <div style="font-size:.8rem;color:var(--text-muted)">Strings</div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

</main>

<footer class="site-footer" role="contentinfo">
  <div class="container" id="site-footer-inner"></div>
</footer>

<script src="assets/js/utils.js"></script>
<script>
(function () {
  const isCs = getLang() === 'cs';
  renderNav('kontakt.html');
  renderFooter();

  document.documentElement.lang = getLang();
  if (!isCs) {
    document.title = 'Contact – CZEGO | Czech Guitar Orchestra';
    document.querySelector('meta[name="description"]').content = 'Contact the Czech Guitar Orchestra CZEGO – info@czego.cz. For concert organisation, sponsorship or membership.';
  }

  document.getElementById('ph-eyebrow').textContent  = isCs ? 'Napište nám' : 'Get in touch';
  document.getElementById('ph-h1').textContent       = isCs ? 'Kontakt' : 'Contact';
  document.getElementById('contact-lead').textContent = isCs
    ? 'Chcete s námi uspořádat koncert, stát se sponzorem nebo se přidat do orchestru?'
    : 'Would you like to organise a concert with us, become a sponsor, or join the orchestra?';
  document.getElementById('reasons-title').textContent = isCs ? 'Ozvěte se nám pokud:' : 'Reach out if you:';

  const reasons = isCs
    ? ['byste s námi rádi zorganizovali koncert', 'nás chcete podpořit a stát se naším sponzorem', 'se k nám chcete přidat jako nový člen', 'máte jiný dotaz']
    : ['would like to organise a concert with us', 'want to support us and become a sponsor', 'want to join us as a new member', 'have any other question'];
  document.getElementById('reasons-list').innerHTML = reasons.map(r => `<li>${escHtml(r)}</li>`).join('');

  document.getElementById('social-title').textContent  = isCs ? 'Sledujte nás' : 'Follow us';
  document.getElementById('sponsors-title').textContent = isCs ? 'Děkujeme sponzorům' : 'Thank you to our sponsors';

  initReveal();
})();
</script>
</body>
</html>
