<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">

  <meta property="og:url"         content="https://czego.cz/">
  <meta property="og:title"       content="CZEGO – Český kytarový orchestr">

  <meta property="og:locale"      content="cs_CZ">
  <meta property="og:site_name"   content="CZEGO">
  <meta name="twitter:card"       content="summary_large_image">
  <meta name="twitter:image"      content="https://czego.cz/assets/images/og/og-default.jpg">
  <meta name="theme-color"        content="#B8251A">
  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MusicGroup",
    "name": "CZEGO – Český kytarový orchestr",
    "alternateName": "Czech Guitar Orchestra",
    "url": "https://czego.cz",
    "description": "Český kytarový orchestr – téměř 30 kytarových nadšenců v čele s dirigentem Vladimírem Novotným.",
    "email": "info@czego.cz",
    "foundingLocation": { "@type": "City", "name": "Praha" },
    "genre": ["Classical", "Film Music", "Pop", "Swing"],
    "sameAs": [
      "https://www.facebook.com/czegocz",
      "https://open.spotify.com/artist/2Kd9Xiqasp6kTFfpBVBGKI",
      "https://www.youtube.com/@CzechGuitarOrchestra"
    ]
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<a class="skip-nav" href="#main-content">Přeskočit na obsah</a>

<header class="site-header" role="banner">
  <div class="container">
    <nav class="nav" aria-label="Hlavní navigace">
      <a class="nav__logo" href="index.html">CZ<span>EGO</span></a>
      <button class="nav__burger" id="nav-burger" aria-label="Otevřít menu" aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav__links" id="nav-links" role="list"></ul>
    </nav>
  </div>
</header>

<main id="main-content" tabindex="-1">

  <!-- HERO -->
  <section class="hero" aria-label="Úvod">
    <div class="container">
      <div class="hero__content" id="hero-content">
        <p class="eyebrow" id="hero-eyebrow"></p>
        <h1 class="hero__h1" id="hero-h1"></h1>
        <p class="hero__sub" id="hero-sub"></p>
        <div class="btn-group">
          <a class="btn btn--primary" href="koncerty.html" id="hero-btn-concerts"></a>
          <a class="btn btn--outline" href="o-nas.html"    id="hero-btn-about"></a>
        </div>
      </div>
    </div>
    <div class="hero__deco" aria-hidden="true">♩</div>
  </section>

  <!-- NADCHÁZEJÍCÍ KONCERTY -->
  <section class="section section--alt" aria-labelledby="upcoming-h2">
    <div class="container">
      <div class="section__header reveal">
        <p class="eyebrow" id="upcoming-eyebrow"></p>
        <h2 id="upcoming-h2"></h2>
        <p class="lead" id="upcoming-lead"></p>
      </div>
      <div id="upcoming-grid" class="reveal"></div>
      <div class="reveal" style="margin-top:2rem">
        <a class="btn btn--outline" href="koncerty.html" id="btn-all-concerts"></a>
      </div>
    </div>
  </section>

  <!-- VIDEA -->
  <section class="section" aria-labelledby="videos-h2">
    <div class="container">
      <div class="section__header reveal">
        <p class="eyebrow" id="videos-eyebrow"></p>
        <h2 id="videos-h2"></h2>
      </div>
      <div class="videos-grid reveal">
        <div class="video-wrap">
          <iframe src="https://www.youtube-nocookie.com/embed/m8Xy8n09o4g"
            title="CZEGO – video 1"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen loading="lazy"></iframe>
        </div>
        <div class="video-wrap">
          <iframe src="https://www.youtube-nocookie.com/embed/F89nTax_1nA"
            title="CZEGO – video 2"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen loading="lazy"></iframe>
        </div>
      </div>
    </div>
  </section>

  <!-- CITÁT -->
  <section class="section" aria-label="Citát">
    <div class="container container--narrow">
      <div class="quote-block reveal">
        <p class="quote-block__text" id="quote-text"></p>
        <cite class="quote-block__cite" id="quote-author"></cite>
        <p class="quote-block__response" id="quote-response"></p>
      </div>
    </div>
  </section>

  <!-- PROJEKTY STRIP -->
  <section class="section section--sand" aria-labelledby="charity-h2">
    <div class="container">
      <div class="two-col">
        <div class="reveal">
          <p class="eyebrow" id="charity-eyebrow"></p>
          <h2 id="charity-h2"></h2>
          <p class="lead" id="charity-lead"></p>
          <div style="margin-top:2rem">
            <a class="btn btn--primary" href="projekty.html" id="btn-projects"></a>
          </div>
        </div>
        <div class="reveal reveal-delay-2" aria-hidden="true">
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem">
            <div style="aspect-ratio:1;background:var(--white);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:var(--shadow-sm)">🎸</div>
            <div style="aspect-ratio:1;background:var(--white);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:var(--shadow-sm)">🏫</div>
            <div style="aspect-ratio:1;background:var(--white);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:var(--shadow-sm)">🌐</div>
            <div style="aspect-ratio:1;background:var(--white);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:var(--shadow-sm)">❤️</div>
            <div style="aspect-ratio:1;background:var(--red);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:var(--shadow-sm)">🌊</div>
            <div style="aspect-ratio:1;background:var(--white);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:var(--shadow-sm)">✈️</div>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer" role="contentinfo">
  <div class="container" id="site-footer-inner"></div>
</footer>

<script src="assets/js/utils.js"></script>
<script>
(function () {
  const isCs = getLang() === 'cs';

  // Nav & footer
  renderNav('index.html');
  renderFooter();

  // Hero texty
  document.getElementById('hero-eyebrow').textContent    = isCs ? 'Český kytarový orchestr · Praha' : 'Czech Guitar Orchestra · Prague';
  document.getElementById('hero-h1').innerHTML           = isCs ? 'Hrajeme,<br><em>protože nás</em><br>to baví.' : 'We play,<br><em>because we</em><br>love it.';
  document.getElementById('hero-sub').textContent        = isCs ? 'Téměř 30 kytarových nadšenců v čele s dirigentem Vladimírem Novotným. Klasika, film, pop i swing – vše na strunách.' : 'Nearly 30 guitar enthusiasts led by conductor Vladimír Novotný. Classical, film, pop and swing – all on strings.';
  document.getElementById('hero-btn-concerts').textContent = isCs ? 'Nadcházející koncerty' : 'Upcoming concerts';
  document.getElementById('hero-btn-about').textContent    = isCs ? 'O orchestru' : 'About us';

  // Sekce nadcházející
  document.getElementById('upcoming-eyebrow').textContent = isCs ? 'Vystoupení' : 'Performances';
  document.getElementById('upcoming-h2').textContent      = isCs ? 'Nadcházející koncerty' : 'Upcoming Concerts';
  document.getElementById('upcoming-lead').textContent    = isCs ? 'Přijďte si vychutnat živou kytarovou hudbu – každý si přijde na své.' : 'Come and enjoy live guitar music – there is something for everyone.';
  document.getElementById('btn-all-concerts').textContent = isCs ? 'Zobrazit všechny koncerty' : 'All concerts';

  // Videa
  document.getElementById('videos-eyebrow').textContent = isCs ? 'Poslouchejte' : 'Listen';
  document.getElementById('videos-h2').textContent      = isCs ? 'Ukázky z tvorby' : 'Featured Videos';

  // Citát
  document.getElementById('quote-text').textContent   = isCs ? 'Kytara je malý orchestr. Je polyfonní. Každá struna je jiná barva, jiný hlas.' : 'The guitar is a small orchestra. It is polyphonic. Every string is a different colour, a different voice.';
  document.getElementById('quote-author').textContent  = '— Andrés Segovia';
  document.getElementById('quote-response').textContent = isCs
    ? 'My jsme orchestr složený z třiceti takových orchestrů.'
    : 'We are an orchestra made up of thirty such orchestras.';

  // Projekty strip
  document.getElementById('charity-eyebrow').textContent = isCs ? 'Benefice & projekty' : 'Charity & Projects';
  document.getElementById('charity-h2').textContent      = isCs ? 'Hudba pomáhá' : 'Music Helps';
  document.getElementById('charity-lead').textContent    = isCs ? 'Podpořili jsme Nedoklubko, Klub cystické fibrózy, ZUŠ Jeseník po povodních. Spolupracujeme s Člověkem v tísni i mezinárodními orchestry.' : 'We have supported Nedoklubko, the Cystic Fibrosis Club, and the Jeseník Art School after floods. We collaborate with People in Need and international orchestras.';
  document.getElementById('btn-projects').textContent    = isCs ? 'Všechny projekty' : 'All projects';

  // Načti nadcházející koncerty
  const grid = document.getElementById('upcoming-grid');
  showLoading('upcoming-grid');
  fetchJSON('data/concerts.json')
    .then(concerts => {
      const upcoming = sortByDate(concerts.filter(c => isUpcoming(c.date)), 'asc');
      if (upcoming.length === 0) {
        grid.innerHTML = `<p class="empty-state">${isCs ? 'Momentálně nejsou naplánované žádné koncerty.' : 'No concerts are currently scheduled.'}</p>`;
      } else {
        grid.innerHTML = `<div class="concerts-grid">${upcoming.map(concertCardHTML).join('')}</div>`;
      }
    })
    .catch(() => showError('upcoming-grid', isCs ? 'Nepodařilo se načíst koncerty.' : 'Failed to load concerts.'))
    .finally(() => initReveal());

  // Spusť reveal pro statické prvky
  initReveal();
})();
</script>
</body>
</html>
