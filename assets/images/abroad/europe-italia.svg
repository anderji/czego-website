<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ab0e8"/>
      <stop offset="100%" stop-color="#a8d4f4"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a870"/>
      <stop offset="100%" stop-color="#b88840"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8c0"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="540" cy="65" r="45" fill="url(#sun)"/>
  <circle cx="540" cy="65" r="32" fill="#fff8c0" opacity=".95"/>

  <!-- Light clouds -->
  <ellipse cx="150" cy="55"  rx="80" ry="28" fill="white" opacity=".65"/>
  <ellipse cx="120" cy="62"  rx="55" ry="22" fill="white" opacity=".6"/>
  <ellipse cx="340" cy="42"  rx="70" ry="25" fill="white" opacity=".55"/>

  <!-- Background hills - Tuscany -->
  <ellipse cx="80"  cy="310" rx="180" ry="80" fill="#78a840" opacity=".6"/>
  <ellipse cx="560" cy="320" rx="200" ry="90" fill="#6a9830" opacity=".55"/>
  <ellipse cx="320" cy="330" rx="250" ry="75" fill="#80b048" opacity=".5"/>

  <!-- Colosseum-style arches (simplified) -->
