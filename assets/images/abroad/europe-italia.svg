  <rect x="120" y="155" width="400" height="25" fill="#c88050"/>
  <rect x="120" y="153" width="400" height="5" fill="#b07040"/>
  <!-- Arches bottom row -->
  <path d="M118 340 L118 230 Q140 205 162 230 L162 340Z" fill="#c07848"/>
  <path d="M170 340 L170 230 Q192 205 214 230 L214 340Z" fill="#c07848"/>
  <path d="M222 340 L222 230 Q244 205 266 230 L266 340Z" fill="#c07848"/>
  <path d="M274 340 L274 230 Q296 205 318 230 L318 340Z" fill="#c07848"/>
