  <rect x="289" y="188" width="30" height="36" rx="3" fill="#8aaecc"/>
  <rect x="330" y="188" width="30" height="36" rx="3" fill="#8aaecc"/>
  <rect x="371" y="188" width="26" height="36" rx="3" fill="#8aaecc"/>
  <rect x="408" y="188" width="26" height="36" rx="3" fill="#8aaecc"/>
