  <rect x="558" y="18" width="66" height="45" rx="3" fill="white" stroke="#d0c0a0" stroke-width="1"/>
  <rect x="558" y="18" width="22" height="45" rx="2" fill="#1a1a1a"/>
  <rect x="580" y="18" width="22" height="45" fill="#f6d800"/>
  <rect x="602" y="18" width="22" height="45" rx="2" fill="#ef3340"/>

