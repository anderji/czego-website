  <rect x="533" y="196" width="72" height="6" fill="#c8a860"/>
  <polygon points="533,198 569,148 605,198" fill="#c09828" stroke="#987020" stroke-width="1.5"/>
  <line x1="569" y1="148" x2="569" y2="128" stroke="#987020" stroke-width="2"/>
  <circle cx="569" cy="126" r="4" fill="#ffd700" opacity=".8"/>
  <rect x="544" y="210" width="18" height="22" rx="2" fill="#90b0cc"/>
  <rect x="567" y="210" width="18" height="22" rx="2" fill="#90b0cc"/>
  <rect x="544" y="242" width="18" height="22" rx="2" fill="#90b0cc"/>
  <rect x="548" y="290" width="38" height="65" rx="2" fill="#7a5820"/>

