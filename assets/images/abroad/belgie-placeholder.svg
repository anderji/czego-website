  <rect x="330" y="238" width="30" height="32" rx="3" fill="#8aaecc"/>
  <rect x="371" y="238" width="26" height="32" rx="3" fill="#8aaecc"/>
  <rect x="408" y="238" width="26" height="32" rx="3" fill="#8aaecc"/>
