  <rect x="0" y="353" width="640" height="5" fill="#d0b878" opacity=".5"/>

  <!-- Label -->
  <rect x="0" y="364" width="178" height="36" fill="#1a3060" opacity=".55"/>
  <text x="14" y="387" font-family="'DM Sans',sans-serif" font-size="12" font-weight="600" fill="white" opacity=".85" letter-spacing="1.5">BELGIE · GRAND PLACE</text>
