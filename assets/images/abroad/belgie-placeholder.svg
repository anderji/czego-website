  <line x1="320" y1="88" x2="320" y2="78" stroke="#3a2010" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="320" y1="88" x2="328" y2="92" stroke="#3a2010" stroke-width="1.5" stroke-linecap="round"/>

