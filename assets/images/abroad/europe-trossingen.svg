<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0e8f8"/>
      <stop offset="100%" stop-color="#e8f4fc"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ab850"/>
      <stop offset="100%" stop-color="#5a9030"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#sky)"/>

  <!-- Fluffy white clouds -->
  <ellipse cx="140" cy="60"  rx="90" ry="34" fill="white" opacity=".85"/>
  <ellipse cx="100" cy="70"  rx="60" ry="26" fill="white" opacity=".8"/>
  <ellipse cx="180" cy="65"  rx="65" ry="28" fill="white" opacity=".75"/>
  <ellipse cx="520" cy="45"  rx="85" ry="32" fill="white" opacity=".82"/>
  <ellipse cx="490" cy="55"  rx="55" ry="24" fill="white" opacity=".75"/>
  <ellipse cx="560" cy="52"  rx="60" ry="26" fill="white" opacity=".7"/>

  <!-- Background hills -->
  <ellipse cx="100" cy="340" rx="200" ry="100" fill="#8dc060" opacity=".5"/>
  <ellipse cx="540" cy="350" rx="220" ry="110" fill="#80b050" opacity=".45"/>

  <!-- Half-timbered German building left -->
  <rect x="60" y="190" width="130" height="145" fill="#f5e8d0"/>
  <rect x="60" y="188" width="130" height="6" fill="#5a3010"/>
  <!-- Timber frame -->
  <line x1="60" y1="230" x2="190" y2="230" stroke="#5a3010" stroke-width="4"/>
  <line x1="60" y1="268" x2="190" y2="268" stroke="#5a3010" stroke-width="3"/>
  <line x1="60" y1="306" x2="190" y2="306" stroke="#5a3010" stroke-width="3"/>
  <line x1="90"  y1="190" x2="90"  y2="335" stroke="#5a3010" stroke-width="3"/>
  <line x1="125" y1="190" x2="125" y2="335" stroke="#5a3010" stroke-width="3"/>
  <line x1="160" y1="190" x2="160" y2="335" stroke="#5a3010" stroke-width="3"/>
  <!-- Diagonals -->
  <line x1="60"  y1="190" x2="90"  y2="230" stroke="#5a3010" stroke-width="2" opacity=".6"/>
  <line x1="90"  y1="190" x2="60"  y2="230" stroke="#5a3010" stroke-width="2" opacity=".6"/>
  <line x1="125" y1="230" x2="160" y2="268" stroke="#5a3010" stroke-width="2" opacity=".6"/>
  <!-- Roof -->
  <polygon points="50,192 125,130 200,192" fill="#8b3a1a" stroke="#6b2a0a" stroke-width="2"/>
  <!-- Windows -->
  <rect x="74" y="198" width="30" height="28" rx="3" fill="#a8c8e0" stroke="#5a3010" stroke-width="1.5"/>
  <rect x="130" y="198" width="30" height="28" rx="3" fill="#a8c8e0" stroke="#5a3010" stroke-width="1.5"/>
  <rect x="74" y="240" width="30" height="24" rx="3" fill="#a8c8e0" stroke="#5a3010" stroke-width="1.5"/>
  <!-- Door -->
  <rect x="100" y="290" width="40" height="45" rx="4" fill="#7a4a20" stroke="#5a3010" stroke-width="1.5"/>

  <!-- Church / Rathaus center -->
  <rect x="230" y="160" width="180" height="175" fill="#f0e8d8"/>
  <!-- Facade details -->
  <line x1="230" y1="220" x2="410" y2="220" stroke="#c8b090" stroke-width="2.5" opacity=".5"/>
  <line x1="230" y1="270" x2="410" y2="270" stroke="#c8b090" stroke-width="2"   opacity=".4"/>
  <!-- Windows center building -->
  <rect x="248" y="175" width="38" height="40" rx="4" fill="#b0ccdc" stroke="#9ab0c0" stroke-width="1.5"/>
  <line x1="267" y1="175" x2="267" y2="215" stroke="#9ab0c0" stroke-width="1"/>
  <line x1="248" y1="195" x2="286" y2="195" stroke="#9ab0c0" stroke-width="1"/>
  <rect x="332" y="175" width="38" height="40" rx="4" fill="#b0ccdc" stroke="#9ab0c0" stroke-width="1.5"/>
  <line x1="351" y1="175" x2="351" y2="215" stroke="#9ab0c0" stroke-width="1"/>
  <line x1="332" y1="195" x2="370" y2="195" stroke="#9ab0c0" stroke-width="1"/>
  <!-- Arched door -->
  <path d="M296 335 L296 280 Q320 258 344 280 L344 335Z" fill="#7a5a30" stroke="#5a3010" stroke-width="1.5"/>
  <!-- Clock -->
  <circle cx="320" cy="245" r="22" fill="#f8f0e0" stroke="#c8b090" stroke-width="2"/>
  <circle cx="320" cy="245" r="2"  fill="#5a3010"/>
  <line x1="320" y1="245" x2="320" y2="230" stroke="#3a2010" stroke-width="2" stroke-linecap="round"/>
  <line x1="320" y1="245" x2="332" y2="248" stroke="#3a2010" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tower -->
  <rect x="300" y="100" width="40" height="62" fill="#d8c8a8"/>
  <polygon points="290,102 320,60 350,102" fill="#8b3a1a" stroke="#6b2a0a" stroke-width="1.5"/>
  <line x1="320" y1="60" x2="320" y2="38" stroke="#8b3a1a" stroke-width="3"/>
  <!-- Weathervane -->
  <line x1="320" y1="38" x2="340" y2="32" stroke="#c0a050" stroke-width="1.5"/>
  <circle cx="320" cy="38" r="3" fill="#c0a050"/>

  <!-- Building right -->
  <rect x="450" y="200" width="120" height="135" fill="#f5e8d0"/>
  <line x1="450" y1="235" x2="570" y2="235" stroke="#5a3010" stroke-width="3.5"/>
  <line x1="480" y1="200" x2="480" y2="335" stroke="#5a3010" stroke-width="3"/>
  <line x1="540" y1="200" x2="540" y2="335" stroke="#5a3010" stroke-width="3"/>
  <line x1="450" y1="200" x2="480" y2="235" stroke="#5a3010" stroke-width="2" opacity=".6"/>
  <line x1="480" y1="200" x2="450" y2="235" stroke="#5a3010" stroke-width="2" opacity=".6"/>
  <polygon points="440,202 510,148 580,202" fill="#8b3a1a" stroke="#6b2a0a" stroke-width="2"/>
  <rect x="462" y="210" width="28" height="22" rx="2" fill="#a8c8e0" stroke="#5a3010" stroke-width="1.5"/>
  <rect x="502" y="244" width="56" height="91" rx="3" fill="#7a4a20" stroke="#5a3010" stroke-width="1.5"/>

  <!-- Ground / cobblestones -->
  <rect x="0" y="335" width="640" height="65" fill="url(#ground)"/>
  <rect x="0" y="333" width="640" height="5" fill="#c8b080" opacity=".5"/>
  <!-- Cobblestone pattern hint -->
  <ellipse cx="200" cy="342" rx="30" ry="5" fill="#b8a070" opacity=".25"/>
  <ellipse cx="320" cy="340" rx="28" ry="4" fill="#b8a070" opacity=".2"/>
  <ellipse cx="450" cy="343" rx="32" ry="5" fill="#b8a070" opacity=".22"/>

  <!-- German flag small -->
  <rect x="30" y="20" width="50" height="36" rx="3" fill="white" stroke="#d0c0a0" stroke-width="1"/>
  <rect x="30" y="20" width="50" height="12" rx="3" fill="#1a1a1a"/>
  <rect x="30" y="32" width="50" height="12" fill="#cc0000"/>
  <rect x="30" y="44" width="50" height="12" rx="3" fill="#ffcc00"/>

  <!-- Label -->
  <rect x="0" y="364" width="210" height="36" fill="#3a2010" opacity=".55"/>
  <text x="14" y="387" font-family="'DM Sans',sans-serif" font-size="12" font-weight="600" fill="white" opacity=".8" letter-spacing="1.5">TROSSINGEN · NĚMECKO</text>
</svg>
