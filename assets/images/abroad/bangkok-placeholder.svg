<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d0406"/>
      <stop offset="30%"  stop-color="#5c1010"/>
      <stop offset="62%"  stop-color="#b83318"/>
      <stop offset="85%"  stop-color="#d9612a"/>
      <stop offset="100%" stop-color="#e8894a"/>
    </linearGradient>
    <linearGradient id="g-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d9612a" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#3a0e0e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d0406"/>
    </linearGradient>
    <radialGradient id="g-glow" cx="50%" cy="100%" r="55%">
      <stop offset="0%"   stop-color="#e8894a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e8894a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-temple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#2a0f0f"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="290" fill="url(#g-sky)"/>

  <!-- Horizon glow -->
  <ellipse cx="400" cy="290" rx="380" ry="72" fill="url(#g-glow)"/>

  <!-- Water -->
  <rect y="290" width="800" height="210" fill="url(#g-water)"/>

  <!-- Water shimmers -->
  <rect x="300" y="298" width="200" height="2"   rx="1" fill="#f0a060" opacity="0.4"/>
  <rect x="330" y="312" width="140" height="1.5" rx="1" fill="#f0a060" opacity="0.28"/>
  <rect x="315" y="328" width="170" height="1"   rx="0.5" fill="#f0a060" opacity="0.18"/>
  <rect x="355" y="345" width="90"  height="1"   rx="0.5" fill="#f0a060" opacity="0.14"/>
  <rect x="260" y="362" width="280" height="1"   rx="0.5" fill="#f0a060" opacity="0.10"/>

  <!-- Stars -->
  <circle cx="95"  cy="28"  r="1.2" fill="white" opacity="0.65"/>
  <circle cx="185" cy="14"  r="1.5" fill="white" opacity="0.50"/>
  <circle cx="265" cy="40"  r="1.0" fill="white" opacity="0.70"/>
  <circle cx="340" cy="10"  r="1.3" fill="white" opacity="0.55"/>
  <circle cx="460" cy="22"  r="1.0" fill="white" opacity="0.60"/>
  <circle cx="550" cy="8"   r="1.5" fill="white" opacity="0.45"/>
  <circle cx="635" cy="32"  r="1.1" fill="white" opacity="0.65"/>
  <circle cx="725" cy="18"  r="1.2" fill="white" opacity="0.50"/>
  <circle cx="150" cy="62"  r="0.8" fill="white" opacity="0.55"/>
  <circle cx="695" cy="55"  r="0.9" fill="white" opacity="0.55"/>
  <circle cx="420" cy="48"  r="0.7" fill="white" opacity="0.45"/>

  <!-- === BASE PLATFORM === -->
  <rect x="80" y="240" width="640" height="50" fill="url(#g-temple)"/>

  <!-- === CENTRAL PRANG (Wat Arun main tower) === -->
  <!-- Main spire tip -->
  <polygon points="400,58 408,100 392,100" fill="#1a0808"/>
  <!-- Spire body -->
  <polygon points="400,72 422,175 378,175" fill="#1a0808"/>
  <!-- Layer 1 -->
  <rect x="370" y="175" width="60" height="11" rx="1" fill="#1a0808"/>
  <!-- Layer 2 -->
  <rect x="360" y="186" width="80" height="11" rx="1" fill="#1a0808"/>
  <!-- Layer 3 (base of central tower) -->
  <rect x="346" y="197" width="108" height="43" fill="#1a0808"/>

  <!-- Small decorative finials on main tower -->
  <polygon points="372,175 375,162 369,162" fill="#1a0808"/>
  <polygon points="428,175 431,162 425,162" fill="#1a0808"/>
  <polygon points="362,186 365,174 359,174" fill="#1a0808"/>
  <polygon points="438,186 441,174 435,174" fill="#1a0808"/>

  <!-- === LEFT INNER CORNER PRANG === -->
  <polygon points="280,125 290,92 270,92" fill="#1a0808"/>
  <polygon points="280,145 298,210 262,210" fill="#1a0808"/>
  <rect x="255" y="210" width="50" height="30" fill="#1a0808"/>
  <!-- small finials -->
  <polygon points="262,210 265,200 259,200" fill="#1a0808"/>
  <polygon points="298,210 301,200 295,200" fill="#1a0808"/>

  <!-- === RIGHT INNER CORNER PRANG === -->
  <polygon points="520,125 530,92 510,92" fill="#1a0808"/>
  <polygon points="520,145 538,210 502,210" fill="#1a0808"/>
  <rect x="495" y="210" width="50" height="30" fill="#1a0808"/>
  <polygon points="502,210 505,200 499,200" fill="#1a0808"/>
  <polygon points="538,210 541,200 535,200" fill="#1a0808"/>

  <!-- === LEFT OUTER CORNER PRANG (smaller) === -->
  <polygon points="175,152 183,125 167,125" fill="#1a0808"/>
  <polygon points="175,170 190,230 160,230" fill="#1a0808"/>
  <rect x="153" y="230" width="44" height="15" fill="#1a0808"/>

  <!-- === RIGHT OUTER CORNER PRANG (smaller) === -->
  <polygon points="625,152 633,125 617,125" fill="#1a0808"/>
  <polygon points="625,170 640,230 610,230" fill="#1a0808"/>
  <rect x="603" y="230" width="44" height="15" fill="#1a0808"/>

  <!-- Distant small spires (far background) -->
  <polygon points="115,190 120,172 110,172" fill="#1a0808" opacity="0.65"/>
  <rect x="107" y="222" width="16" height="20" fill="#1a0808" opacity="0.65"/>
  <polygon points="685,190 690,172 680,172" fill="#1a0808" opacity="0.65"/>
  <rect x="677" y="222" width="16" height="20" fill="#1a0808" opacity="0.65"/>

  <!-- === WATER REFLECTION (faint, blurred effect via opacity) === -->
  <g opacity="0.18" transform="translate(0,580) scale(1,-1)">
    <polygon points="400,72 422,175 378,175" fill="#e8894a"/>
    <rect x="346" y="197" width="108" height="43" fill="#e8894a"/>
    <polygon points="280,145 298,210 262,210" fill="#e8894a"/>
    <polygon points="520,145 538,210 502,210" fill="#e8894a"/>
    <polygon points="175,170 190,230 160,230" fill="#e8894a"/>
    <polygon points="625,170 640,230 610,230" fill="#e8894a"/>
  </g>

  <!-- Label bar -->
  <rect x="0" y="418" width="800" height="82" fill="#0d0406" opacity="0.72"/>
  <text x="400" y="448" text-anchor="middle" fill="#f5e0cc"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" letter-spacing="4" opacity="0.90">BANGKOK · THAJSKO · 2024</text>
  <text x="400" y="470" text-anchor="middle" fill="#d9612a"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="11" letter-spacing="2" opacity="0.80">Mezinárodní kytarový festival</text>
  <!-- Thin decorative line -->
  <line x1="320" y1="482" x2="480" y2="482" stroke="#d9612a" stroke-width="0.5" opacity="0.5"/>
</svg>
