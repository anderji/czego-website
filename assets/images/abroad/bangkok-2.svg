<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0520"/>
      <stop offset="60%" stop-color="#1a0a40"/>
      <stop offset="100%" stop-color="#3a1060"/>
    </linearGradient>
    <radialGradient id="spot1" cx="30%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot2" cx="70%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fffbe0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#sky)"/>
  <rect width="640" height="400" fill="url(#spot1)"/>
  <rect width="640" height="400" fill="url(#spot2)"/>

  <!-- Stars -->
  <circle cx="80"  cy="35"  r="1.2" fill="white" opacity=".7"/>
  <circle cx="155" cy="18"  r="0.9" fill="white" opacity=".6"/>
  <circle cx="230" cy="48"  r="1.4" fill="white" opacity=".5"/>
  <circle cx="340" cy="22"  r="1"   fill="white" opacity=".65"/>
  <circle cx="420" cy="40"  r="1.3" fill="white" opacity=".55"/>
  <circle cx="510" cy="12"  r="0.8" fill="white" opacity=".7"/>
  <circle cx="575" cy="55"  r="1.1" fill="white" opacity=".6"/>
  <circle cx="50"  cy="90"  r="0.9" fill="white" opacity=".45"/>
  <circle cx="590" cy="80"  r="1"   fill="white" opacity=".5"/>

  <!-- Moon -->
  <circle cx="520" cy="70" r="30" fill="url(#moonGlow)"/>
  <circle cx="520" cy="70" r="22" fill="#fffbe0" opacity=".92"/>
  <circle cx="528" cy="64" r="16" fill="#1a0a40"/>

  <!-- Thai temple silhouette -->
  <!-- Base platform -->
  <rect x="120" y="290" width="400" height="18" fill="#2a1550"/>
  <rect x="140" y="272" width="360" height="20" fill="#2a1550"/>
  <!-- Main prang (tower) center -->
  <polygon points="320,90 295,280 345,280" fill="#3a1a60"/>
  <polygon points="320,90 300,270 340,270" fill="#4a2570"/>
  <!-- Side prangs -->
  <polygon points="230,155 212,278 248,278" fill="#321860"/>
  <polygon points="410,155 392,278 428,278" fill="#321860"/>
  <!-- Small towers -->
  <polygon points="175,200 162,278 188,278" fill="#2a1555"/>
  <polygon points="465,200 452,278 478,278" fill="#2a1555"/>
  <!-- Decorative rings on main prang -->
  <ellipse cx="320" cy="140" rx="18" ry="5" fill="#5a3080" opacity=".8"/>
  <ellipse cx="320" cy="175" rx="22" ry="6" fill="#5a3080" opacity=".7"/>
  <ellipse cx="320" cy="215" rx="26" ry="7" fill="#5a3080" opacity=".6"/>
  <ellipse cx="320" cy="255" rx="30" ry="7" fill="#5a3080" opacity=".5"/>

  <!-- Stage / concert area at bottom -->
  <rect x="0" y="308" width="640" height="92" fill="#0d0525"/>
  <rect x="180" y="305" width="280" height="8" rx="2" fill="#ffd700" opacity=".18"/>
  <!-- Stage lights beams -->
  <line x1="192" y1="308" x2="250" y2="380" stroke="#ffd700" stroke-width="18" opacity=".06"/>
  <line x1="240" y1="308" x2="280" y2="380" stroke="#ffd700" stroke-width="14" opacity=".07"/>
  <line x1="320" y1="308" x2="320" y2="380" stroke="#fff"    stroke-width="16" opacity=".05"/>
  <line x1="400" y1="308" x2="360" y2="380" stroke="#ff6a00" stroke-width="14" opacity=".07"/>
  <line x1="448" y1="308" x2="390" y2="380" stroke="#ff6a00" stroke-width="18" opacity=".06"/>

  <!-- Silhouette audience -->
  <ellipse cx="200" cy="390" rx="18" ry="22" fill="#0d0525"/>
  <ellipse cx="240" cy="388" rx="16" ry="20" fill="#0d0525"/>
  <ellipse cx="278" cy="392" rx="15" ry="18" fill="#0d0525"/>
  <ellipse cx="315" cy="386" rx="17" ry="21" fill="#0d0525"/>
  <ellipse cx="352" cy="390" rx="16" ry="19" fill="#0d0525"/>
  <ellipse cx="390" cy="388" rx="18" ry="22" fill="#0d0525"/>
  <ellipse cx="428" cy="392" rx="15" ry="18" fill="#0d0525"/>

  <!-- Lanterns -->
  <ellipse cx="150" cy="240" rx="10" ry="14" fill="#ff9900" opacity=".7"/>
  <line x1="150" y1="226" x2="150" y2="215" stroke="#c87030" stroke-width="1.5" opacity=".6"/>
  <ellipse cx="490" cy="225" rx="9"  ry="12" fill="#ff6600" opacity=".65"/>
  <line x1="490" y1="213" x2="490" y2="200" stroke="#c87030" stroke-width="1.5" opacity=".6"/>

  <!-- Label -->
  <rect x="0" y="0" width="200" height="36" rx="0" fill="#0a0520" opacity=".7"/>
  <text x="14" y="23" font-family="'DM Sans',sans-serif" font-size="12" font-weight="600" fill="white" opacity=".75" letter-spacing="1.5">BANGKOK · NOČNÍ VYSTOUPENÍ</text>
</svg>
