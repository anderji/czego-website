<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2040"/>
      <stop offset="45%" stop-color="#0d3060"/>
      <stop offset="100%" stop-color="#104080"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#082030"/>
      <stop offset="100%" stop-color="#041018"/>
    </linearGradient>
    <radialGradient id="cityGlow" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#20a0c0" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#20a0c0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#sky)"/>
  <rect width="640" height="400" fill="url(#cityGlow)"/>

  <!-- Stars -->
  <circle cx="50"  cy="28" r="1.2" fill="white" opacity=".6"/>
  <circle cx="120" cy="15" r="0.9" fill="white" opacity=".5"/>
  <circle cx="190" cy="38" r="1.4" fill="white" opacity=".55"/>
  <circle cx="460" cy="22" r="1"   fill="white" opacity=".6"/>
  <circle cx="540" cy="12" r="1.3" fill="white" opacity=".5"/>
  <circle cx="600" cy="40" r="0.8" fill="white" opacity=".65"/>

  <!-- Marina Bay Sands - three towers + sky deck -->
  <!-- Tower 1 -->
  <rect x="230" y="130" width="42" height="180" fill="#1a3a6a"/>
  <rect x="234" y="134" width="34" height="176" fill="#1e4278"/>
  <!-- Tower 2 -->
  <rect x="299" y="115" width="42" height="195" fill="#1a3a6a"/>
  <rect x="303" y="119" width="34" height="191" fill="#1e4278"/>
  <!-- Tower 3 -->
  <rect x="368" y="128" width="42" height="182" fill="#1a3a6a"/>
  <rect x="372" y="132" width="34" height="178" fill="#1e4278"/>
  <!-- Sky deck connecting three towers -->
  <rect x="218" y="115" width="204" height="22" rx="6" fill="#2a5090"/>
  <rect x="218" y="115" width="204" height="6"  rx="3" fill="#3a6ab0" opacity=".6"/>
  <!-- Infinity pool edge glow -->
  <rect x="380" y="122" width="42" height="4" rx="2" fill="#40c0f0" opacity=".6"/>

  <!-- Tower windows -->
  <g fill="#60d0f0" opacity=".35">
    <rect x="238" y="145" width="5" height="4" rx="1"/>
    <rect x="248" y="145" width="5" height="4" rx="1"/>
    <rect x="258" y="145" width="5" height="4" rx="1"/>
    <rect x="238" y="158" width="5" height="4" rx="1"/>
    <rect x="248" y="158" width="5" height="4" rx="1"/>
    <rect x="238" y="172" width="5" height="4" rx="1"/>
    <rect x="308" y="128" width="5" height="4" rx="1"/>
    <rect x="318" y="128" width="5" height="4" rx="1"/>
    <rect x="328" y="128" width="5" height="4" rx="1"/>
    <rect x="308" y="142" width="5" height="4" rx="1"/>
    <rect x="318" y="142" width="5" height="4" rx="1"/>
    <rect x="308" y="156" width="5" height="4" rx="1"/>
    <rect x="377" y="142" width="5" height="4" rx="1"/>
    <rect x="387" y="142" width="5" height="4" rx="1"/>
    <rect x="397" y="142" width="5" height="4" rx="1"/>
    <rect x="377" y="156" width="5" height="4" rx="1"/>
    <rect x="387" y="158" width="5" height="4" rx="1"/>
  </g>

  <!-- Supertrees - Gardens by the Bay -->
  <!-- Left supertree -->
  <line x1="140" y1="310" x2="140" y2="190" stroke="#1a4030" stroke-width="8"/>
  <circle cx="140" cy="185" r="38" fill="#1e5040" opacity=".85"/>
  <circle cx="140" cy="185" r="30" fill="#246050" opacity=".8"/>
  <!-- Lights on supertree -->
  <circle cx="120" cy="175" r="3" fill="#60f0a0" opacity=".6"/>
  <circle cx="140" cy="162" r="3" fill="#60d0f0" opacity=".6"/>
  <circle cx="160" cy="175" r="3" fill="#60f0a0" opacity=".6"/>
  <circle cx="152" cy="195" r="2" fill="#a0f060" opacity=".5"/>
  <circle cx="128" cy="196" r="2" fill="#a0f060" opacity=".5"/>
  <!-- Right supertree -->
  <line x1="500" y1="310" x2="500" y2="200" stroke="#1a4030" stroke-width="7"/>
  <circle cx="500" cy="195" r="34" fill="#1e5040" opacity=".8"/>
  <circle cx="500" cy="195" r="26" fill="#246050" opacity=".75"/>
  <circle cx="483" cy="186" r="2.5" fill="#60f0a0" opacity=".6"/>
  <circle cx="500" cy="174" r="2.5" fill="#60d0f0" opacity=".6"/>
  <circle cx="517" cy="186" r="2.5" fill="#60f0a0" opacity=".6"/>

  <!-- City skyline background (lower) -->
  <rect x="60"  y="240" width="100" height="70" fill="#102848" opacity=".7"/>
  <rect x="80"  y="220" width="60"  height="90" fill="#122e55" opacity=".65"/>
  <rect x="560" y="230" width="80"  height="80" fill="#102848" opacity=".7"/>
  <rect x="545" y="215" width="50"  height="95" fill="#122e55" opacity=".65"/>

  <!-- Water / Marina Bay -->
  <rect x="0" y="310" width="640" height="90" fill="url(#water)"/>
  <!-- Reflections -->
  <line x1="251" y1="312" x2="251" y2="350" stroke="#3a70c0" stroke-width="2"  opacity=".2"/>
  <line x1="320" y1="312" x2="320" y2="360" stroke="#3a70c0" stroke-width="1.5" opacity=".18"/>
  <line x1="389" y1="312" x2="389" y2="348" stroke="#3a70c0" stroke-width="2"  opacity=".2"/>
  <line x1="140" y1="312" x2="140" y2="340" stroke="#60f0a0" stroke-width="1.5" opacity=".15"/>
  <line x1="500" y1="312" x2="500" y2="338" stroke="#60f0a0" stroke-width="1.5" opacity=".14"/>
  <!-- Water ripples -->
  <path d="M0 328 Q80 322 160 328 Q240 334 320 328 Q400 322 480 328 Q560 334 640 328" fill="none" stroke="#163060" stroke-width="1.5" opacity=".5"/>

  <!-- Label -->
  <rect x="0" y="0" width="195" height="36" fill="#0a2040" opacity=".75"/>
  <text x="14" y="23" font-family="'DM Sans',sans-serif" font-size="12" font-weight="600" fill="white" opacity=".8" letter-spacing="1.5">SINGAPUR · MARINA BAY</text>
</svg>
