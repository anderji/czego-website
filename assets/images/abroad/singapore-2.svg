<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4f0"/>
      <stop offset="100%" stop-color="#c0e8e0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#40a880"/>
      <stop offset="100%" stop-color="#2a7858"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- Fluffy clouds -->
  <ellipse cx="120" cy="70"  rx="90"  ry="35" fill="white" opacity=".75"/>
  <ellipse cx="80"  cy="80"  rx="60"  ry="28" fill="white" opacity=".7"/>
  <ellipse cx="160" cy="75"  rx="65"  ry="30" fill="white" opacity=".65"/>
  <ellipse cx="480" cy="55"  rx="100" ry="38" fill="white" opacity=".7"/>
  <ellipse cx="440" cy="65"  rx="70"  ry="30" fill="white" opacity=".65"/>
  <ellipse cx="530" cy="60"  rx="75"  ry="32" fill="white" opacity=".6"/>

  <!-- Merlion silhouette -->
  <!-- Body -->
  <ellipse cx="320" cy="240" rx="55" ry="75" fill="#c0d8e0"/>
  <!-- Fish tail -->
  <path d="M270 290 Q240 320 255 350 Q280 330 320 315 Q360 330 385 350 Q400 320 370 290Z" fill="#a0c0cc"/>
  <!-- Head -->
  <ellipse cx="320" cy="160" rx="42" ry="45" fill="#c0d8e0"/>
  <!-- Mane -->
  <path d="M280 155 Q265 130 278 115 Q295 100 320 105 Q345 100 362 115 Q375 130 360 155" fill="#b0c8d8"/>
  <!-- Eyes -->
  <circle cx="308" cy="155" r="8" fill="white"/>
  <circle cx="332" cy="155" r="8" fill="white"/>
  <circle cx="310" cy="156" r="5" fill="#2a5070"/>
  <circle cx="334" cy="156" r="5" fill="#2a5070"/>
  <!-- Nose -->
  <ellipse cx="320" cy="172" rx="10" ry="6" fill="#90b0c0"/>
  <!-- Water jet from mouth -->
  <path d="M320 165 Q340 140 360 120 Q380 100 400 85" fill="none" stroke="#60c0f0" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <path d="M320 165 Q342 138 365 115 Q385 97 408 80" fill="none" stroke="#a0d8f4" stroke-width="3" stroke-linecap="round" opacity=".5"/>

  <!-- Green garden ground -->
  <rect x="0" y="310" width="640" height="90" fill="url(#ground)"/>
  <!-- Grass details -->
  <ellipse cx="100" cy="312" rx="80"  ry="12" fill="#50b890" opacity=".5"/>
  <ellipse cx="400" cy="314" rx="100" ry="10" fill="#50b890" opacity=".45"/>
  <ellipse cx="580" cy="312" rx="70"  ry="11" fill="#50b890" opacity=".5"/>

  <!-- Tropical plants -->
  <line x1="80" y1="310" x2="80" y2="260" stroke="#2a6040" stroke-width="4"/>
  <ellipse cx="80" cy="255" rx="30" ry="20" fill="#3a8050" opacity=".9"/>
  <ellipse cx="65" cy="262" rx="22" ry="14" fill="#448860" opacity=".85"/>
  <ellipse cx="95" cy="260" rx="22" ry="14" fill="#448860" opacity=".85"/>

  <line x1="560" y1="310" x2="560" y2="255" stroke="#2a6040" stroke-width="4"/>
  <ellipse cx="560" cy="250" rx="28" ry="18" fill="#3a8050" opacity=".9"/>
  <ellipse cx="545" cy="257" rx="20" ry="13" fill="#448860" opacity=".85"/>
  <ellipse cx="575" cy="255" rx="20" ry="13" fill="#448860" opacity=".85"/>

  <!-- Orchids -->
  <circle cx="180" cy="295" r="8" fill="#c060a0" opacity=".7"/>
  <circle cx="168" cy="285" r="6" fill="#d070b0" opacity=".65"/>
  <circle cx="192" cy="283" r="6" fill="#d070b0" opacity=".65"/>
  <circle cx="450" cy="298" r="7" fill="#c060a0" opacity=".7"/>
  <circle cx="440" cy="288" r="5" fill="#d070b0" opacity=".65"/>

  <!-- Singapore flag colors badge -->
  <rect x="525" y="20" width="100" height="55" rx="6" fill="white" opacity=".85" stroke="#e0e8ec" stroke-width="1"/>
  <rect x="525" y="20" width="100" height="27" rx="6" fill="#ee2536" opacity=".9"/>
  <rect x="525" y="47" width="100" height="28" rx="0" fill="white" opacity=".95"/>
  <rect x="525" y="47" width="100" height="4" fill="#ee2536" opacity=".15"/>
  <!-- Crescent + stars -->
  <circle cx="548" cy="33" r="9" fill="white" opacity=".9"/>
  <circle cx="552" cy="30" r="7" fill="#ee2536" opacity=".9"/>
  <circle cx="566" cy="28" r="2" fill="white" opacity=".9"/>
  <circle cx="572" cy="33" r="2" fill="white" opacity=".9"/>
  <circle cx="568" cy="39" r="2" fill="white" opacity=".9"/>
  <circle cx="561" cy="42" r="2" fill="white" opacity=".9"/>
  <circle cx="558" cy="36" r="2" fill="white" opacity=".9"/>

  <!-- Label -->
  <rect x="0" y="0" width="200" height="36" fill="#0a4030" opacity=".5"/>
  <text x="14" y="23" font-family="'DM Sans',sans-serif" font-size="12" font-weight="600" fill="white" opacity=".8" letter-spacing="1.5">SINGAPUR · GARDENS</text>
</svg>
