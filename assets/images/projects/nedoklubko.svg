<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf0f5"/>
      <stop offset="100%" stop-color="#f5e0ea"/>
    </linearGradient>
    <radialGradient id="heartglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e84080" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e84080" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f06090"/>
      <stop offset="100%" stop-color="#c02060"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e84080" stop-opacity="0"/>
      <stop offset="40%" stop-color="#e84080" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e84080" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Soft concentric circles -->
  <circle cx="320" cy="175" r="220" fill="none" stroke="#f4b8cc" stroke-width="1" opacity="0.4"/>
  <circle cx="320" cy="175" r="170" fill="none" stroke="#f4b8cc" stroke-width="1" opacity="0.35"/>
  <circle cx="320" cy="175" r="120" fill="none" stroke="#f4b8cc" stroke-width="1" opacity="0.3"/>

  <!-- Large glow behind heart -->
  <circle cx="320" cy="165" r="130" fill="url(#heartglow)"/>

  <!-- Big heart -->
  <path d="M320 270 C190 210 130 140 170 95 C195 58 250 65 320 115 C390 65 445 58 470 95 C510 140 450 210 320 270Z" fill="url(#heartgrad)" opacity="0.88"/>

  <!-- Heart shine -->
  <ellipse cx="275" cy="120" rx="28" ry="18" fill="white" opacity="0.2" transform="rotate(-30,275,120)"/>

  <!-- Pulse / ECG line -->
  <rect x="60" y="238" width="520" height="40" rx="6" fill="white" opacity="0.55"/>
  <polyline points="60,258 140,258 165,258 178,228 190,288 202,228 215,258 290,258 310,248 325,268 340,248 355,258 430,258 640,258"
    fill="none" stroke="url(#pulse)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small baby silhouette inside heart -->
  <!-- Head -->
  <circle cx="320" cy="158" r="26" fill="white" opacity="0.25"/>
  <!-- Body curl -->
  <path d="M310 178 Q296 200 305 218 Q314 236 326 232 Q340 228 340 210 Q340 192 330 180Z" fill="white" opacity="0.2"/>

  <!-- Stars / sparkles around -->
  <text x="148" y="95" font-family="serif" font-size="20" fill="#f06090" opacity="0.5" transform="rotate(-15,148,95)">✦</text>
  <text x="468" y="90" font-family="serif" font-size="16" fill="#f06090" opacity="0.45" transform="rotate(12,468,90)">✦</text>
  <text x="115" y="185" font-family="serif" font-size="14" fill="#c060a0" opacity="0.4">✦</text>
  <text x="500" y="195" font-family="serif" font-size="18" fill="#c060a0" opacity="0.38" transform="rotate(-8,500,195)">✦</text>

  <!-- "Nedoklubko" tag left -->
  <rect x="38" y="95" width="148" height="78" rx="10" fill="white" opacity="0.75" stroke="#f4b8cc" stroke-width="1.5"/>
  <circle cx="62" cy="118" r="14" fill="#f06090" opacity="0.75"/>
  <text x="62" y="123" font-family="serif" font-size="16" fill="white" text-anchor="middle">♡</text>
  <text x="94" y="112" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#c02060" opacity="0.9">NEDOKLUBKO</text>
  <text x="86" y="130" font-family="'DM Sans', sans-serif" font-size="10" fill="#a04060" opacity="0.75">Předčasně narozené</text>
  <text x="86" y="144" font-family="'DM Sans', sans-serif" font-size="10" fill="#a04060" opacity="0.75">děti</text>
  <text x="86" y="160" font-family="'DM Sans', sans-serif" font-size="10" fill="#a04060" opacity="0.65">a jejich rodiny</text>

  <!-- "Klub CF" tag right -->
  <rect x="458" y="95" width="148" height="78" rx="10" fill="white" opacity="0.75" stroke="#c8b0d8" stroke-width="1.5"/>
  <circle cx="482" cy="118" r="14" fill="#9b59b6" opacity="0.7"/>
  <text x="482" y="123" font-family="serif" font-size="16" fill="white" text-anchor="middle">♡</text>
  <text x="512" y="112" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#6a3090" opacity="0.9">KLUB CF</text>
  <text x="506" y="130" font-family="'DM Sans', sans-serif" font-size="10" fill="#7040a0" opacity="0.75">Cystická fibróza</text>
  <text x="506" y="146" font-family="'DM Sans', sans-serif" font-size="10" fill="#7040a0" opacity="0.7">Podpora pacientů</text>

  <!-- Music notes -->
  <text x="80" y="310" font-family="serif" font-size="22" fill="#f06090" opacity="0.3" transform="rotate(-10,80,310)">♪</text>
  <text x="540" y="305" font-family="serif" font-size="18" fill="#9b59b6" opacity="0.28" transform="rotate(8,540,305)">♫</text>

  <!-- Label -->
  <rect x="0" y="318" width="640" height="42" fill="#c02060" opacity="0.08"/>
  <text x="320" y="344" font-family="'Playfair Display', Georgia, serif" font-size="15" font-weight="700" fill="#c02060" opacity="0.45" text-anchor="middle" letter-spacing="1.5">PODPORA NEDOKLUBKA A KLUBU CF</text>
</svg>
