<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6ec"/>
      <stop offset="100%" stop-color="#f5e9d3"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d7a5c"/>
      <stop offset="100%" stop-color="#2e5e45"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d5b0"/>
      <stop offset="100%" stop-color="#d4bc8e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Floor -->
  <rect x="0" y="290" width="640" height="70" fill="url(#floor)"/>
  <rect x="0" y="288" width="640" height="4" fill="#c9a96e" opacity="0.5"/>

  <!-- Back wall stripe -->
  <rect x="0" y="0" width="640" height="290" fill="#fdf0de" opacity="0.6"/>

  <!-- Chalkboard -->
  <rect x="60" y="50" width="220" height="155" rx="4" fill="url(#board)"/>
  <rect x="68" y="58" width="204" height="139" rx="2" fill="#3a7356" opacity="0.6"/>
  <!-- Board frame -->
  <rect x="60" y="50" width="220" height="155" rx="4" fill="none" stroke="#5a3e1b" stroke-width="5"/>
  <!-- Board legs -->
  <line x1="110" y1="205" x2="95" y2="250" stroke="#6b4c1e" stroke-width="5" stroke-linecap="round"/>
  <line x1="230" y1="205" x2="245" y2="250" stroke="#6b4c1e" stroke-width="5" stroke-linecap="round"/>

  <!-- Chalk notes on board -->
  <text x="100" y="108" font-family="serif" font-size="38" fill="white" opacity="0.85">♩ ♪</text>
  <text x="110" y="155" font-family="serif" font-size="30" fill="white" opacity="0.7">♫ ♬</text>
  <!-- Staff lines on board -->
  <line x1="80" y1="172" x2="265" y2="172" stroke="white" stroke-width="1.2" opacity="0.35"/>
  <line x1="80" y1="178" x2="265" y2="178" stroke="white" stroke-width="1.2" opacity="0.35"/>
  <line x1="80" y1="184" x2="265" y2="184" stroke="white" stroke-width="1.2" opacity="0.35"/>

  <!-- ── Child 1 (left) ── -->
  <!-- Body -->
  <rect x="320" y="195" width="28" height="62" rx="7" fill="#f4a261"/>
  <!-- Head -->
  <circle cx="334" cy="180" r="22" fill="#f9c89a"/>
  <!-- Hair -->
  <ellipse cx="334" cy="162" rx="22" ry="11" fill="#5c3317"/>
  <rect x="312" y="162" width="44" height="10" rx="5" fill="#5c3317"/>
  <!-- Eyes -->
  <circle cx="326" cy="178" r="2.5" fill="#3a2210"/>
  <circle cx="342" cy="178" r="2.5" fill="#3a2210"/>
  <!-- Smile -->
  <path d="M328 186 Q334 191 340 186" fill="none" stroke="#c0704a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Guitar body -->
  <ellipse cx="334" cy="242" rx="14" ry="17" fill="#c67c3a"/>
  <ellipse cx="334" cy="232" rx="9" ry="11" fill="#d4884a"/>
  <ellipse cx="334" cy="242" rx="14" ry="17" fill="none" stroke="#8b4e1a" stroke-width="1.5"/>
  <!-- Guitar neck -->
  <rect x="330" y="210" width="8" height="28" rx="3" fill="#a0612a"/>
  <!-- Sound hole -->
  <circle cx="334" cy="242" r="4" fill="#7a3c10"/>
  <!-- Strings -->
  <line x1="334" y1="216" x2="334" y2="258" stroke="#e8d5a0" stroke-width="0.8" opacity="0.7"/>
  <line x1="332" y1="216" x2="332" y2="258" stroke="#e8d5a0" stroke-width="0.8" opacity="0.7"/>
  <line x1="336" y1="216" x2="336" y2="258" stroke="#e8d5a0" stroke-width="0.8" opacity="0.7"/>
  <!-- Arms -->
  <line x1="320" y1="210" x2="300" y2="228" stroke="#f4a261" stroke-width="9" stroke-linecap="round"/>
  <line x1="348" y1="210" x2="362" y2="230" stroke="#f4a261" stroke-width="9" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="326" y1="257" x2="320" y2="290" stroke="#4a6fa5" stroke-width="10" stroke-linecap="round"/>
  <line x1="342" y1="257" x2="348" y2="290" stroke="#4a6fa5" stroke-width="10" stroke-linecap="round"/>
  <!-- Shoes -->
  <ellipse cx="318" cy="291" rx="10" ry="5" fill="#2c3e50"/>
  <ellipse cx="350" cy="291" rx="10" ry="5" fill="#2c3e50"/>

  <!-- ── Child 2 (center) ── -->
  <!-- Body -->
  <rect x="405" y="192" width="30" height="65" rx="7" fill="#e76f51"/>
  <!-- Head -->
  <circle cx="420" cy="176" r="23" fill="#f9c89a"/>
  <!-- Hair (pigtails) -->
  <ellipse cx="420" cy="157" rx="23" ry="12" fill="#8b3a3a"/>
  <ellipse cx="403" cy="162" rx="7" ry="10" fill="#8b3a3a"/>
  <ellipse cx="437" cy="162" rx="7" ry="10" fill="#8b3a3a"/>
  <!-- Eyes -->
  <circle cx="413" cy="174" r="2.5" fill="#3a2210"/>
  <circle cx="427" cy="174" r="2.5" fill="#3a2210"/>
  <!-- Smile -->
  <path d="M414 183 Q420 189 426 183" fill="none" stroke="#c0704a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Guitar (smaller, tilted) -->
  <g transform="rotate(-12, 420, 240)">
    <ellipse cx="420" cy="248" rx="13" ry="16" fill="#b8621f"/>
    <ellipse cx="420" cy="238" rx="8" ry="10" fill="#c97030"/>
    <ellipse cx="420" cy="248" rx="13" ry="16" fill="none" stroke="#7a3c10" stroke-width="1.5"/>
    <rect x="416" y="215" width="8" height="26" rx="3" fill="#96511a"/>
    <circle cx="420" cy="248" r="3.5" fill="#6b2e08"/>
    <line x1="420" y1="220" x2="420" y2="262" stroke="#e8d5a0" stroke-width="0.8" opacity="0.6"/>
    <line x1="418" y1="220" x2="418" y2="262" stroke="#e8d5a0" stroke-width="0.8" opacity="0.6"/>
    <line x1="422" y1="220" x2="422" y2="262" stroke="#e8d5a0" stroke-width="0.8" opacity="0.6"/>
  </g>
  <!-- Arms -->
  <line x1="405" y1="207" x2="385" y2="228" stroke="#e76f51" stroke-width="9" stroke-linecap="round"/>
  <line x1="435" y1="207" x2="452" y2="226" stroke="#e76f51" stroke-width="9" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="414" y1="257" x2="408" y2="290" stroke="#264653" stroke-width="10" stroke-linecap="round"/>
  <line x1="426" y1="257" x2="432" y2="290" stroke="#264653" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="406" cy="291" rx="10" ry="5" fill="#2c3e50"/>
  <ellipse cx="434" cy="291" rx="10" ry="5" fill="#2c3e50"/>

  <!-- ── Child 3 (right) ── -->
  <!-- Body -->
  <rect x="493" y="196" width="28" height="62" rx="7" fill="#57b89e"/>
  <!-- Head -->
  <circle cx="507" cy="180" r="22" fill="#f5c5a0"/>
  <!-- Hair (short) -->
  <ellipse cx="507" cy="162" rx="22" ry="10" fill="#3a2f1e"/>
  <!-- Eyes -->
  <circle cx="499" cy="179" r="2.5" fill="#3a2210"/>
  <circle cx="515" cy="179" r="2.5" fill="#3a2210"/>
  <!-- Smile -->
  <path d="M500 187 Q507 192 514 187" fill="none" stroke="#c0704a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Guitar -->
  <ellipse cx="507" cy="244" rx="13" ry="16" fill="#c07030"/>
  <ellipse cx="507" cy="234" rx="8" ry="10" fill="#d08040"/>
  <ellipse cx="507" cy="244" rx="13" ry="16" fill="none" stroke="#7a3c10" stroke-width="1.5"/>
  <rect x="503" y="213" width="8" height="25" rx="3" fill="#9a5520"/>
  <circle cx="507" cy="244" r="3.5" fill="#6b2e08"/>
  <line x1="507" y1="218" x2="507" y2="258" stroke="#e8d5a0" stroke-width="0.8" opacity="0.7"/>
  <line x1="505" y1="218" x2="505" y2="258" stroke="#e8d5a0" stroke-width="0.8" opacity="0.7"/>
  <line x1="509" y1="218" x2="509" y2="258" stroke="#e8d5a0" stroke-width="0.8" opacity="0.7"/>
  <!-- Arms -->
  <line x1="493" y1="212" x2="474" y2="230" stroke="#57b89e" stroke-width="9" stroke-linecap="round"/>
  <line x1="521" y1="212" x2="537" y2="228" stroke="#57b89e" stroke-width="9" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="500" y1="258" x2="494" y2="290" stroke="#e9c46a" stroke-width="10" stroke-linecap="round"/>
  <line x1="514" y1="258" x2="520" y2="290" stroke="#e9c46a" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="492" cy="291" rx="10" ry="5" fill="#2c3e50"/>
  <ellipse cx="522" cy="291" rx="10" ry="5" fill="#2c3e50"/>

  <!-- Floating music notes -->
  <text x="290" y="80" font-family="serif" font-size="28" fill="#B8251A" opacity="0.25" transform="rotate(-15,290,80)">♪</text>
  <text x="380" y="60" font-family="serif" font-size="22" fill="#B8251A" opacity="0.2" transform="rotate(10,380,60)">♫</text>
  <text x="460" y="75" font-family="serif" font-size="32" fill="#B8251A" opacity="0.22" transform="rotate(-8,460,75)">♩</text>
  <text x="540" y="55" font-family="serif" font-size="20" fill="#B8251A" opacity="0.18" transform="rotate(12,540,55)">♬</text>
  <text x="560" y="140" font-family="serif" font-size="26" fill="#B8251A" opacity="0.2" transform="rotate(-10,560,140)">♪</text>

  <!-- Label band at bottom -->
  <rect x="0" y="310" width="640" height="50" fill="#B8251A" opacity="0.08"/>
  <text x="320" y="342" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700" fill="#B8251A" opacity="0.55" text-anchor="middle" letter-spacing="2">KAPELA VE ŠKOLE</text>
</svg>
