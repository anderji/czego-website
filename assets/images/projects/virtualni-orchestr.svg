<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1d35"/>
      <stop offset="100%" stop-color="#1a2f50"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a90d9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4a90d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globeglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e4a80" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="45" cy="30" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="120" cy="55" r="0.9" fill="white" opacity="0.5"/>
  <circle cx="200" cy="20" r="1.4" fill="white" opacity="0.7"/>
  <circle cx="310" cy="40" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="420" cy="18" r="1.1" fill="white" opacity="0.6"/>
  <circle cx="500" cy="45" r="1.3" fill="white" opacity="0.5"/>
  <circle cx="580" cy="28" r="0.9" fill="white" opacity="0.7"/>
  <circle cx="60" cy="100" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="590" cy="100" r="1" fill="white" opacity="0.5"/>
  <circle cx="550" cy="290" r="1.1" fill="white" opacity="0.4"/>
  <circle cx="80" cy="300" r="0.9" fill="white" opacity="0.5"/>

  <!-- Globe glow -->
  <circle cx="320" cy="175" r="145" fill="url(#glow)"/>

  <!-- Globe outline -->
  <circle cx="320" cy="175" r="118" fill="url(#globeglow)" stroke="#4a80c4" stroke-width="1.5" opacity="0.8"/>

  <!-- Globe latitude lines -->
  <ellipse cx="320" cy="175" rx="118" ry="38" fill="none" stroke="#4a80c4" stroke-width="0.8" opacity="0.35"/>
  <ellipse cx="320" cy="175" rx="118" ry="78" fill="none" stroke="#4a80c4" stroke-width="0.8" opacity="0.25"/>
  <line x1="202" y1="175" x2="438" y2="175" stroke="#4a80c4" stroke-width="0.8" opacity="0.3"/>
  <!-- Globe longitude lines -->
  <ellipse cx="320" cy="175" rx="38" ry="118" fill="none" stroke="#4a80c4" stroke-width="0.8" opacity="0.3"/>
  <ellipse cx="320" cy="175" rx="78" ry="118" fill="none" stroke="#4a80c4" stroke-width="0.8" opacity="0.25"/>

  <!-- Connection dots (cities) and lines -->
  <!-- Prague (center) -->
  <circle cx="340" cy="155" r="5" fill="#f4a261" opacity="0.95"/>
  <circle cx="340" cy="155" r="10" fill="#f4a261" opacity="0.25"/>

  <!-- Other locations -->
  <circle cx="240" cy="140" r="4" fill="#64c8d4" opacity="0.9"/>
  <circle cx="410" cy="130" r="4" fill="#64c8d4" opacity="0.9"/>
  <circle cx="260" cy="210" r="4" fill="#64c8d4" opacity="0.9"/>
  <circle cx="400" cy="205" r="4" fill="#64c8d4" opacity="0.9"/>
  <circle cx="300" cy="235" r="3.5" fill="#64c8d4" opacity="0.8"/>
  <circle cx="360" cy="240" r="3.5" fill="#64c8d4" opacity="0.8"/>
  <circle cx="220" cy="175" r="3" fill="#9b8cff" opacity="0.8"/>
  <circle cx="430" cy="170" r="3" fill="#9b8cff" opacity="0.8"/>

  <!-- Connection lines -->
  <line x1="340" y1="155" x2="240" y2="140" stroke="#64c8d4" stroke-width="1" opacity="0.45" stroke-dasharray="3,3"/>
  <line x1="340" y1="155" x2="410" y2="130" stroke="#64c8d4" stroke-width="1" opacity="0.45" stroke-dasharray="3,3"/>
  <line x1="340" y1="155" x2="260" y2="210" stroke="#64c8d4" stroke-width="1" opacity="0.4" stroke-dasharray="3,3"/>
  <line x1="340" y1="155" x2="400" y2="205" stroke="#64c8d4" stroke-width="1" opacity="0.4" stroke-dasharray="3,3"/>
  <line x1="340" y1="155" x2="300" y2="235" stroke="#9b8cff" stroke-width="1" opacity="0.35" stroke-dasharray="3,3"/>
  <line x1="340" y1="155" x2="360" y2="240" stroke="#9b8cff" stroke-width="1" opacity="0.35" stroke-dasharray="3,3"/>
  <line x1="340" y1="155" x2="220" y2="175" stroke="#9b8cff" stroke-width="1" opacity="0.35" stroke-dasharray="3,3"/>
  <line x1="340" y1="155" x2="430" y2="170" stroke="#9b8cff" stroke-width="1" opacity="0.35" stroke-dasharray="3,3"/>

  <!-- Guitar silhouette (overlay, white/light) -->
  <g transform="translate(295, 82) scale(0.72)" opacity="0.18">
    <rect x="24" y="0" width="12" height="100" rx="5" fill="white"/>
    <rect x="20" y="-28" width="20" height="32" rx="4" fill="white"/>
    <ellipse cx="30" cy="155" rx="36" ry="42" fill="white"/>
    <ellipse cx="30" cy="112" rx="26" ry="32" fill="white"/>
    <rect x="6" y="123" width="48" height="16" fill="white"/>
  </g>

  <!-- Floating notes -->
  <text x="145" y="115" font-family="serif" font-size="24" fill="#64c8d4" opacity="0.45" transform="rotate(-15,145,115)">♪</text>
  <text x="475" y="108" font-family="serif" font-size="20" fill="#9b8cff" opacity="0.4" transform="rotate(10,475,108)">♫</text>
  <text x="155" y="255" font-family="serif" font-size="18" fill="#64c8d4" opacity="0.35">♩</text>
  <text x="480" y="260" font-family="serif" font-size="22" fill="#9b8cff" opacity="0.38" transform="rotate(-8,480,260)">♬</text>

  <!-- "20+ zemí" badge -->
  <rect x="490" y="290" width="130" height="46" rx="8" fill="#1e3a6a" stroke="#4a80c4" stroke-width="1" opacity="0.85"/>
  <text x="555" y="308" font-family="'DM Sans', sans-serif" font-size="11" fill="#64c8d4" text-anchor="middle" font-weight="600" opacity="0.9">VIRTUÁLNÍ ORCHESTR</text>
  <text x="555" y="326" font-family="'Playfair Display', serif" font-size="15" fill="white" text-anchor="middle" font-weight="700" opacity="0.85">20+ zemí světa</text>

  <!-- Label -->
  <rect x="0" y="320" width="460" height="40" fill="#0f1d35" opacity="0.6"/>
  <text x="24" y="344" font-family="'Playfair Display', Georgia, serif" font-size="15" font-weight="700" fill="white" opacity="0.55" letter-spacing="2">VIRTUÁLNÍ KYTAROVÝ ORCHESTR</text>
</svg>
