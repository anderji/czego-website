<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bdd8f0"/>
      <stop offset="100%" stop-color="#deedf8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a9fd4"/>
      <stop offset="100%" stop-color="#1e6fa8"/>
    </linearGradient>
    <linearGradient id="hope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9a825"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="640" height="360" fill="url(#sky)"/>

  <!-- Mountains / hills in background -->
  <ellipse cx="150" cy="220" rx="200" ry="100" fill="#a8c5a0" opacity="0.55"/>
  <ellipse cx="500" cy="230" rx="220" ry="110" fill="#94b88c" opacity="0.5"/>
  <ellipse cx="320" cy="240" rx="180" ry="90" fill="#b0cba8" opacity="0.45"/>

  <!-- Water level high – flood -->
  <rect x="0" y="258" width="640" height="102" fill="url(#water)" opacity="0.82"/>
  <!-- Water waves -->
  <path d="M0 262 Q40 254 80 262 Q120 270 160 262 Q200 254 240 262 Q280 270 320 262 Q360 254 400 262 Q440 270 480 262 Q520 254 560 262 Q600 270 640 262 L640 260 L0 260Z" fill="#5ab0e0" opacity="0.6"/>
  <path d="M0 278 Q50 270 100 278 Q150 286 200 278 Q250 270 300 278 Q350 286 400 278 Q450 270 500 278 Q550 286 600 278 Q620 278 640 278 L640 276 L0 276Z" fill="#7ac4e8" opacity="0.4"/>

  <!-- School building -->
  <!-- Main body -->
  <rect x="185" y="138" width="270" height="138" fill="#e8dbc8" stroke="#b0956a" stroke-width="2"/>
  <!-- Roof -->
  <polygon points="170,140 320,68 470,140" fill="#c0855a" stroke="#9a6438" stroke-width="2"/>
  <!-- Roof ridge -->
  <line x1="320" y1="68" x2="320" y2="138" stroke="#9a6438" stroke-width="1.5" opacity="0.5"/>

  <!-- Door -->
  <rect x="292" y="208" width="56" height="68" rx="4" fill="#8b6340" stroke="#6b4820" stroke-width="1.5"/>
  <circle cx="338" cy="243" r="4" fill="#c0843a"/>
  <rect x="296" y="212" width="22" height="28" rx="2" fill="#5a7a40" opacity="0.7"/>
  <rect x="322" y="212" width="22" height="28" rx="2" fill="#5a7a40" opacity="0.7"/>

  <!-- Windows -->
  <rect x="202" y="158" width="48" height="44" rx="3" fill="#a8c8e8" stroke="#8090a8" stroke-width="1.5"/>
  <line x1="226" y1="158" x2="226" y2="202" stroke="#8090a8" stroke-width="1"/>
  <line x1="202" y1="180" x2="250" y2="180" stroke="#8090a8" stroke-width="1"/>

  <rect x="390" y="158" width="48" height="44" rx="3" fill="#a8c8e8" stroke="#8090a8" stroke-width="1.5"/>
  <line x1="414" y1="158" x2="414" y2="202" stroke="#8090a8" stroke-width="1"/>
  <line x1="390" y1="180" x2="438" y2="180" stroke="#8090a8" stroke-width="1"/>

  <!-- ZUŠ sign on building -->
  <rect x="258" y="150" width="124" height="30" rx="3" fill="#c0855a" opacity="0.85"/>
  <text x="320" y="170" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1.5">ZUŠ JESENÍK</text>

  <!-- Water flooding base of building -->
  <rect x="185" y="250" width="270" height="26" fill="url(#water)" opacity="0.55"/>

  <!-- Sun / hope ray in corner -->
  <circle cx="575" cy="55" r="38" fill="url(#hope)" opacity="0.75"/>
  <circle cx="575" cy="55" r="28" fill="#fdd060" opacity="0.9"/>
  <!-- Sun rays -->
  <line x1="575" y1="5" x2="575" y2="20" stroke="#f9a825" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="575" y1="90" x2="575" y2="105" stroke="#f9a825" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="525" y1="55" x2="540" y2="55" stroke="#f9a825" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="610" y1="55" x2="625" y2="55" stroke="#f9a825" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="540" y1="20" x2="550" y2="30" stroke="#f9a825" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="600" y1="80" x2="610" y2="90" stroke="#f9a825" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Musical note floating above water -->
  <text x="110" y="175" font-family="serif" font-size="36" fill="#B8251A" opacity="0.35" transform="rotate(-10,110,175)">♪</text>
  <text x="500" y="165" font-family="serif" font-size="28" fill="#B8251A" opacity="0.3" transform="rotate(8,500,165)">♫</text>

  <!-- Heart on building -->
  <path d="M320 96 C308 88 296 90 296 100 C296 112 320 124 320 124 C320 124 344 112 344 100 C344 90 332 88 320 96Z" fill="#e84545" opacity="0.75"/>

  <!-- Label -->
  <rect x="0" y="318" width="640" height="42" fill="#1e3d6a" opacity="0.55"/>
  <text x="320" y="344" font-family="'Playfair Display', Georgia, serif" font-size="15" font-weight="700" fill="white" opacity="0.7" text-anchor="middle" letter-spacing="1.5">PODPORA ZUŠ JESENÍK PO POVODNÍCH</text>
</svg>
