<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#1a2e50"/>
    </linearGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d6a2d"/>
      <stop offset="100%" stop-color="#1a4a1a"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gift1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e84545"/>
      <stop offset="100%" stop-color="#B8251A"/>
    </linearGradient>
    <linearGradient id="gift2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#2060a8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Snow ground -->
  <ellipse cx="320" cy="360" rx="380" ry="55" fill="white" opacity="0.12"/>
  <rect x="0" y="320" width="640" height="40" fill="white" opacity="0.08"/>

  <!-- Stars scattered -->
  <circle cx="55" cy="28" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="145" cy="15" r="1" fill="white" opacity="0.6"/>
  <circle cx="210" cy="45" r="1.8" fill="white" opacity="0.5"/>
  <circle cx="460" cy="22" r="1.2" fill="white" opacity="0.65"/>
  <circle cx="530" cy="40" r="1.5" fill="white" opacity="0.55"/>
  <circle cx="600" cy="18" r="1" fill="white" opacity="0.7"/>
  <circle cx="88" cy="90" r="1" fill="white" opacity="0.4"/>
  <circle cx="568" cy="85" r="1.3" fill="white" opacity="0.45"/>

  <!-- Snowflakes -->
  <text x="80" y="130" font-family="serif" font-size="16" fill="white" opacity="0.2">❄</text>
  <text x="530" y="100" font-family="serif" font-size="12" fill="white" opacity="0.18">❄</text>
  <text x="580" y="200" font-family="serif" font-size="14" fill="white" opacity="0.15">❄</text>
  <text x="50" y="220" font-family="serif" font-size="10" fill="white" opacity="0.18">❄</text>

  <!-- Christmas tree layers -->
  <polygon points="320,40 230,170 410,170" fill="url(#tree)" stroke="#3a7a3a" stroke-width="1.5"/>
  <polygon points="320,90 215,240 425,240" fill="url(#tree)" stroke="#3a7a3a" stroke-width="1.5"/>
  <polygon points="320,148 200,310 440,310" fill="url(#tree)" stroke="#2a5a2a" stroke-width="1.5"/>
  <!-- Tree trunk -->
  <rect x="302" y="306" width="36" height="30" rx="3" fill="#6b3c1a" stroke="#5a2e10" stroke-width="1.5"/>

  <!-- Tree ornaments -->
  <circle cx="285" cy="158" r="7" fill="#e84545" opacity="0.9"/>
  <circle cx="355" cy="168" r="6" fill="#4a90d9" opacity="0.9"/>
  <circle cx="316" cy="178" r="8" fill="#f9c825" opacity="0.85"/>
  <circle cx="255" cy="222" r="7" fill="#e84545" opacity="0.85"/>
  <circle cx="385" cy="228" r="6" fill="#9b59b6" opacity="0.9"/>
  <circle cx="320" cy="240" r="9" fill="#4a90d9" opacity="0.85"/>
  <circle cx="273" cy="260" r="7" fill="#f9c825" opacity="0.8"/>
  <circle cx="368" cy="258" r="7" fill="#e84545" opacity="0.85"/>
  <circle cx="230" cy="285" r="6" fill="#4a90d9" opacity="0.8"/>
  <circle cx="405" cy="280" r="8" fill="#2ecc71" opacity="0.85"/>
  <circle cx="305" cy="295" r="6" fill="#9b59b6" opacity="0.8"/>
  <circle cx="340" cy="298" r="7" fill="#e84545" opacity="0.85"/>

  <!-- Garland string -->
  <path d="M248,165 Q260,172 275,160 Q290,150 305,162 Q320,172 335,162 Q350,150 365,162 Q378,172 392,162" fill="none" stroke="#f9c825" stroke-width="1.5" opacity="0.5"/>
  <path d="M218,238 Q240,248 265,235 Q290,224 315,238 Q340,250 365,238 Q390,224 415,235" fill="none" stroke="#f4a261" stroke-width="1.5" opacity="0.45"/>

  <!-- Star on top -->
  <circle cx="320" cy="38" r="28" fill="url(#starGlow)"/>
  <text x="320" y="52" font-family="serif" font-size="34" fill="#ffd700" text-anchor="middle" opacity="0.95">★</text>

  <!-- Gift boxes -->
  <!-- Gift 1 left -->
  <rect x="120" y="270" width="70" height="55" rx="4" fill="url(#gift1)"/>
  <rect x="120" y="268" width="70" height="12" rx="3" fill="#c0200c"/>
  <line x1="155" y1="268" x2="155" y2="325" stroke="#ffd700" stroke-width="3"/>
  <line x1="120" y1="295" x2="190" y2="295" stroke="#ffd700" stroke-width="3"/>
  <ellipse cx="155" cy="268" rx="14" ry="8" fill="none" stroke="#ffd700" stroke-width="2.5"/>

  <!-- Gift 2 right -->
  <rect x="460" y="275" width="64" height="50" rx="4" fill="url(#gift2)"/>
  <rect x="460" y="273" width="64" height="11" rx="3" fill="#1a4a90"/>
  <line x1="492" y1="273" x2="492" y2="325" stroke="#f4a261" stroke-width="3"/>
  <line x1="460" y1="298" x2="524" y2="298" stroke="#f4a261" stroke-width="3"/>
  <ellipse cx="492" cy="273" rx="12" ry="7" fill="none" stroke="#f4a261" stroke-width="2.5"/>

  <!-- Note -->
  <text x="82" y="195" font-family="serif" font-size="26" fill="#ffd700" opacity="0.35" transform="rotate(-15,82,195)">♪</text>
  <text x="538" y="185" font-family="serif" font-size="22" fill="#ffd700" opacity="0.3" transform="rotate(12,538,185)">♫</text>

  <!-- Label -->
  <rect x="195" y="20" width="250" height="32" rx="5" fill="#B8251A" opacity="0.6"/>
  <text x="320" y="41" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="700" fill="white" opacity="0.9" text-anchor="middle" letter-spacing="1.5">JEŽÍŠKOVA VNOUČATA</text>
</svg>
