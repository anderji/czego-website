  // Group destinations by year, sorted descending
  const byYear = {};
  destinations.forEach(d => {
    if (!byYear[d.year]) byYear[d.year] = [];
    byYear[d.year].push(d);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  function renderYearTabs(activeYear) {
    document.getElementById('abroad-tablist').innerHTML = years.map(y => `
      <button class="abroad-tab${y === activeYear ? ' abroad-tab--active' : ''}"
        role="tab" aria-selected="${y === activeYear}" data-year="${y}">${y}</button>
    `).join('');
    document.querySelectorAll('#abroad-tablist .abroad-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        const year = Number(btn.dataset.year);
        const firstId = byYear[year][0].id;
        renderYearTabs(year);
        renderDestTabs(year, firstId);
        renderAbroadPanel(firstId);
      });
    });
  }

  function renderDestTabs(activeYear, activeId) {
    const subtablist = document.getElementById('abroad-subtablist');
    const dests = byYear[activeYear];
    if (dests.length > 1) {
      subtablist.innerHTML = dests.map(d => `
        <button class="abroad-dest-tab${d.id === activeId ? ' abroad-dest-tab--active' : ''}"
          data-tab="${d.id}" data-year="${activeYear}">
          ${d.label[isCs ? 'cs' : 'en']}
        </button>`).join('');
      subtablist.querySelectorAll('.abroad-dest-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          renderDestTabs(Number(btn.dataset.year), btn.dataset.tab);
          renderAbroadPanel(btn.dataset.tab);
        });
      });
    } else {
      subtablist.innerHTML = '';
    }
  }

  function carouselHTML(images, lang) {
    if (!images || !images.length) return '';
    const slides = images.map(img =>
      `<img src="${escHtml(img.src)}" alt="${escHtml(img.alt[lang])}" loading="lazy">`
    ).join('');
    const dots = images.length > 1
      ? `<div class="abroad-carousel__dots">
           ${images.map((_, i) => `<button class="abroad-carousel__dot${i === 0 ? ' abroad-carousel__dot--active' : ''}" aria-label="Snímek ${i + 1}"></button>`).join('')}
         </div>`
      : '';
    const btns = images.length > 1
      ? `<button class="abroad-carousel__btn abroad-carousel__btn--prev" aria-label="Předchozí">&#8249;</button>
         <button class="abroad-carousel__btn abroad-carousel__btn--next" aria-label="Další">&#8250;</button>`
      : '';
    return `<div class="abroad-carousel">
      <div class="abroad-carousel__track">${slides}</div>
      ${btns}${dots}
    </div>`;
  }

  function initCarousels() {
    document.querySelectorAll('.abroad-carousel').forEach(carousel => {
      const track = carousel.querySelector('.abroad-carousel__track');
      const dots  = Array.from(carousel.querySelectorAll('.abroad-carousel__dot'));
      const total = track.children.length;
      if (total < 2) return;
      let cur = 0;

      function goTo(idx) {
        cur = (idx + total) % total;
        track.style.transform = `translateX(-${cur * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('abroad-carousel__dot--active', i === cur));
      }

      carousel.querySelector('.abroad-carousel__btn--prev')
        .addEventListener('click', () => goTo(cur - 1));
      carousel.querySelector('.abroad-carousel__btn--next')
        .addEventListener('click', () => goTo(cur + 1));
      dots.forEach((d, i) => d.addEventListener('click', () => goTo(i)));
    });
  }

  function renderAbroadPanel(activeId) {
    const d    = destinations.find(x => x.id === activeId);
    const lang = isCs ? 'cs' : 'en';
    const textsHtml = d.texts[lang].map(t =>
      `<p>${escHtml(t)}</p>`).join('');
    const listData  = d.list && d.list[lang];
    const listHtml  = listData
      ? `<p><strong>${escHtml(listData.title)}</strong></p><ul>${listData.items.map(i => `<li>${escHtml(i)}</li>`).join('')}</ul>`
      : '';
    const linkHtml  = d.link
      ? `<a class="abroad-link" href="${escHtml(d.link.url)}" target="_blank" rel="noopener noreferrer"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.75 15.5V8.5l6.25 3.5-6.25 3.5z"/></svg>${isCs ? 'Záznam z koncertu' : 'Concert recording'}</a>`
      : '';
    const hasImages = d.images && d.images.length > 0;

    document.getElementById('abroad-panels').innerHTML = `
      <div class="abroad-panel" id="panel-${d.id}" role="tabpanel">
        ${hasImages ? `
        <div class="two-col two-col--abroad">
          <div>${carouselHTML(d.images, lang)}</div>
          <div class="abroad-content">
            <p class="abroad-event">${escHtml(d.event[lang])}</p>
            <h3 class="abroad-title">${escHtml(d.title[lang])}</h3>
            <div class="abroad-texts">${textsHtml}${listHtml}</div>
            ${linkHtml}
          </div>
        </div>` : `
        <div class="abroad-content abroad-content--full">
          <p class="abroad-event">${escHtml(d.event[lang])}</p>
          <h3 class="abroad-title">${escHtml(d.title[lang])}</h3>
          <div class="abroad-texts">${textsHtml}${listHtml}</div>
          ${linkHtml}
        </div>`}
      </div>`;

    initCarousels();
  }

  renderAbroadPanel('stuttgart');

  ];
  document.getElementById('partner-logos').innerHTML = partnerLogos
    .map(l => `<img src="${escHtml(l.src)}" alt="${escHtml(l.alt)}" class="partner-logo" loading="lazy">`)
    .join('');

  document.getElementById('btn-projects').textContent = isCs ? 'Všechny projekty' : 'All projects';

  initReveal();
