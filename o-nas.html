<script>
(function () {
  const isCs = getLang() === 'cs';
  renderNav('o-nas.html');
  renderFooter();

  document.documentElement.lang = getLang();
  if (!isCs) {
    document.title = 'About – CZEGO | Czech Guitar Orchestra';
    document.querySelector('meta[name="description"]').content = 'Discover the story of the Czech Guitar Orchestra CZEGO. Nearly 30 musicians, conductor Vladimír Novotný, international festivals in Bangkok, Hong Kong and Singapore.';
  }

  // Page header
  document.getElementById('ph-eyebrow').textContent = isCs ? 'Kdo jsme' : 'Who we are';
  document.getElementById('ph-h1').textContent       = isCs ? 'Orchestr s duší' : 'An Orchestra with Soul';

  // Příběh

  document.getElementById('story-p1').textContent  = isCs
    ? 'Jsme Český kytarový orchestr (dříve Pražský komorní kytarový orchestr) – téměř 30 kytarových nadšenců v čele s dirigentem Vladimírem Novotným.'
    : 'We are the Czech Guitar Orchestra (formerly the Prague Chamber Guitar Orchestra) – nearly 30 guitar enthusiasts led by conductor Vladimír Novotný.';
  document.getElementById('story-p2').textContent  = isCs
    ? 'Náš repertoár se skládá jak z klasické hudby, tak z filmových melodií a aranžmá na pomezí popu a swingu. Kromě hraní nás občas uvidíte i zpívat nebo hrát na perkusové nástroje.'
    : 'Our repertoire spans classical music, film scores, and arrangements on the border of pop and swing. Besides playing, you might sometimes see us singing or performing on percussion instruments.';
  document.getElementById('story-p3').textContent  = isCs
    ? 'Pravidelně se účastníme zahraničních festivalů a soutěží. Nejdál jsme byli v Hongkongu, Singapuru a v roce 2024 v Bangkoku.'
    : 'We regularly take part in international festivals and competitions. Our furthest tours have taken us to Hong Kong, Singapore, and Bangkok in 2024.';
  document.getElementById('btn-members').textContent = isCs ? 'Poznat členy' : 'Meet the members';

  // Stats
  document.getElementById('stat-members').textContent  = isCs ? 'Členů' : 'Members';
  document.getElementById('stat-years').textContent    = isCs ? 'Let' : 'Years';
  document.getElementById('stat-countries').textContent = isCs ? 'Zemí' : 'Countries';
  document.getElementById('stat-concerts').textContent  = isCs ? 'Koncertů ročně' : 'Concerts per year';

  // Zahraničí – header
  document.getElementById('abroad-eyebrow').textContent = isCs ? 'Svět' : 'The World';
  document.getElementById('abroad-h2').textContent      = isCs ? 'Zahraničí' : 'International';
  document.getElementById('abroad-lead').textContent    = isCs
    ? 'Pravidelně reprezentujeme českou orchestrální tradici na festivalech po Evropě i za oceánem.'
    : 'We regularly represent Czech orchestral tradition at festivals across Europe and beyond.';

  // Zahraničí – taby
  const destinations = [
    {
      id: 'belgie',
      year: 2025,
      flag: '🇧🇪',
      label:    { cs: 'Belgie 2025',                 en: 'Belgium 2025' },
      title:    { cs: 'Belgie',                      en: 'Belgium' },
      event:    { cs: 'Mezinárodní kytarový festival', en: 'International Guitar Festival' },
      texts:    {
        cs: [
          'V roce 2025 jsme se zúčastnili mezinárodního kytarového festivalu v Belgii. Vystoupení v srdci Evropy bylo dalším krokem na naší cestě za sdílením české kytarové kultury se světem.',
          'Brusel a jeho okolí nás přivítaly jako hosty a my jsme mohli ukázat, co v sobě český kytarový orchestr nese – pečlivě budovanou souhru, dramaturgii a lásku ke kytaře.',
        ],
        en: [
          'In 2025 we participated in an international guitar festival in Belgium. Performing in the heart of Europe was another step on our journey of sharing Czech guitar culture with the world.',
          'Brussels and the surrounding region welcomed us as guests, giving us the opportunity to show what the Czech Guitar Orchestra is all about — carefully crafted ensemble playing, thoughtful programming, and a love for the guitar.',
        ],
      },
      facts: {
        cs: ['Brusel', '🗓 2025', '🎸 Mezinárodní festival', '🏛 Koncertní síň'],
        en: ['Brussels', '🗓 2025', '🎸 International festival', '🏛 Concert hall'],
      },
      images: [
        { src: 'assets/images/abroad/Belgie.jpg', alt: { cs: 'Grand Place, Brusel', en: 'Grand Place, Brussels' } },
        { src: 'assets/images/abroad/Belgie1.jpg',           alt: { cs: 'Vystoupení v belgické koncertní síni', en: 'Performance in a Belgian concert hall' } },
      ],
      highlight: true,
    },
    {
      id: 'bangkok',
      year: 2024,
      flag: '🇹🇭',
      label:    { cs: 'Bangkok 2024',               en: 'Bangkok 2024' },
      title:    { cs: 'Bangkok, Thajsko',            en: 'Bangkok, Thailand' },
      event:    { cs: 'Mezinárodní kytarový festival', en: 'International Guitar Festival' },
      texts:    {
        cs: [
          'V létě 2024 jsme se vydali na naše dosud největší dobrodružství – mezinárodní kytarový festival v Bangkoku, Thajsku. Osmičlenná výprava reprezentovala Českou republiku spolu s orchestry z Asie, Evropy i zámoří.',
          'Vystoupení v tropickém teple, setkání s muzikanty z celého světa a kulturní zážitky, které nám zůstanou navždy. Bangkok byl pro nás milníkem, na který nezapomeneme.',
        ],
        en: [
          'In summer 2024 we embarked on our biggest adventure yet — an international guitar festival in Bangkok, Thailand. Our eight-person delegation represented the Czech Republic alongside orchestras from Asia, Europe, and beyond.',
          'Performing in tropical heat, meeting musicians from around the world, and unforgettable cultural experiences. Bangkok was a milestone we will never forget.',
        ],
      },
      facts: {
        cs: ['Thajsko', '🗓 Léto 2024', '🎸 Mezinárodní festival', '👥 8 členů výpravy'],
        en: ['Thailand', '🗓 Summer 2024', '🎸 International festival', '👥 8 delegates'],
      },
      images: [
        { src: 'assets/images/abroad/Thajsko1.jpg', alt: { cs: 'Chrám Wat Arun při západu slunce', en: 'Wat Arun temple at sunset' } },
        { src: 'assets/images/abroad/Thajsko2.jpeg',           alt: { cs: 'Noční vystoupení v Bangkoku',      en: 'Night performance in Bangkok' } },
        { src: 'assets/images/abroad/Thajsko3.jpg',           alt: { cs: 'Kulturní zážitky v Bangkoku',      en: 'Cultural experiences in Bangkok' } },
      ],
      highlight: true,
    },
    {
      id: 'barcelona',
      year: 2023,
      flag: '🇪🇸',
      label:    { cs: 'Barcelona 2023',             en: 'Barcelona 2023' },
      title:    { cs: 'Barcelona, Španělsko',       en: 'Barcelona, Spain' },
      event:    { cs: 'Mezinárodní kytarový festival', en: 'International Guitar Festival' },
      texts:    {
        cs: [
          'Barcelona 2023 – slunce, moře a hudba na slavné promenádě. Zúčastnili jsme se mezinárodního kytarového festivalu ve městě Gaudího architektonických divů a živé kulturní scény.',
          'Vystupovat v Barceloně bylo výjimečným zážitkem – město dýchá hudbou na každém rohu a místní publikum nás přijalo se srdečností, která nám zůstane v paměti.',
        ],
        en: [
          'Barcelona 2023 — sun, sea, and music on the famous promenade. We took part in an international guitar festival in the city of Gaudí\'s architectural wonders and vibrant cultural scene.',
          'Performing in Barcelona was an exceptional experience — the city breathes music on every corner, and the local audience welcomed us with warmth we will long remember.',
        ],
      },
      facts: {
        cs: ['Španělsko', '🗓 2023', '🎸 Mezinárodní festival', '🏖 Barceloneta'],
        en: ['Spain', '🗓 2023', '🎸 International festival', '🏖 Barceloneta'],
      },
      images: [
        { src: 'assets/images/abroad/Barcelona.jpg', alt: { cs: 'Sagrada Família při západu slunce', en: 'Sagrada Família at sunset' } },
        { src: 'assets/images/abroad/Barcelona2.jpg',           alt: { cs: 'Vystoupení na barcelonské promenádě', en: 'Performance on the Barcelona promenade' } },
        { src: 'assets/images/abroad/Barcelona3.jpg',           alt: { cs: 'Vystoupení na barcelonské promenádě', en: 'Performance on the Barcelona promenade' } },

      ],
      highlight: true,
    },
    {
      id: 'asie',
      year: 2018,
      flag: '🌏',
      label:    { cs: 'Asie',                        en: 'Asia' },
      title:    { cs: 'Hongkong & Singapur',         en: 'Hong Kong & Singapore' },
      event:    { cs: 'Festivaly & soutěže',         en: 'Festivals & Competitions' },
      texts:    {
        cs: [
          'Hongkong byl jednou z prvních zastávek za oceánem. Účast na mezinárodní kytarové soutěži přinesla cenné zkušenosti i nová přátelství mezi muzikanty z celého světa.',
          'Singapur byl dalším vrcholem naší zahraniční kariéry. Moderní metropole plná kontrastů nám dala příležitost ukázat český kytarový orchestr světovému publiku na mezinárodní scéně.',
        ],
        en: [
          'Hong Kong was one of the orchestra\'s first overseas stops. Participating in an international guitar competition brought invaluable experience and new friendships with musicians from around the globe.',
          'Singapore was another highlight of our international journey. The modern metropolis full of contrasts gave us the opportunity to showcase Czech guitar playing to a world audience.',
        ],
      },
      facts: {
        cs: ['Hongkong', 'Singapur', '🏆 Soutěže', '🎸 Festivaly'],
        en: ['Hong Kong', 'Singapore', '🏆 Competitions', '🎸 Festivals'],
      },
      images: [
        { src: 'assets/images/abroad/HongKong1.jpg', alt: { cs: 'Hongkong', en: 'Hong Kong' } },
        { src: 'assets/images/abroad/HongKong2.jpg', alt: { cs: 'Hongkong', en: 'Hong Kong' } },
        { src: 'assets/images/abroad/Singapur1.jpg', alt: { cs: 'Singapur', en: 'Singapore' } },
        { src: 'assets/images/abroad/Singapur2.jpg', alt: { cs: 'Singapur', en: 'Singapore' } },
      ],
    },
    {
      id: 'europe',
      year: 2019,
      flag: '🇪🇺',
      label:    { cs: 'Evropa',               en: 'Europe' },
      title:    { cs: 'Evropské festivaly',   en: 'European Festivals' },
      event:    { cs: 'Festivaly & soutěže',  en: 'Festivals & Competitions' },
      texts:    {
        cs: ['Krom zámořských expedic pravidelně závodíme a vystupujeme na festivalech po celé Evropě. Navštívili jsme festival v německém Trossingen, účastnili se mezinárodních soutěží v Německu i Itálii a budujeme síť kontaktů v evropské kytarové komunitě.'],
        en: ['Alongside overseas expeditions we regularly compete and perform at festivals across Europe. We have visited the festival in Trossingen, Germany, participated in competitions in Germany and Italy, and continue building ties within the European guitar community.'],
      },
      facts: {
        cs: ['Trossingen', 'Itálie', '🗓 2019', '🏆 Soutěže', '🎸 Festivaly'],
        en: ['Trossingen', 'Italy', '🗓 2019', '🏆 Competitions', '🎸 Festivals'],
      },
      images: [
        { src: 'assets/images/abroad/europe-trossingen.svg', alt: { cs: 'Trossingen, Německo', en: 'Trossingen, Germany' } },
        { src: 'assets/images/abroad/europe-italia.svg',     alt: { cs: 'Itálie',               en: 'Italy' } },
      ],
    },
  ];

  function renderAbroadTabs(activeId) {
    const tablist = document.getElementById('abroad-tablist');
    tablist.innerHTML = destinations.map(d => `
      <button
        class="abroad-tab${d.id === activeId ? ' abroad-tab--active' : ''}${d.highlight ? ' abroad-tab--highlight' : ''}"
        role="tab"
        aria-selected="${d.id === activeId}"
        aria-controls="panel-${d.id}"
        data-tab="${d.id}">
        ${d.flag} ${d.label[isCs ? 'cs' : 'en']}
      </button>`).join('');

    tablist.querySelectorAll('.abroad-tab').forEach(btn => {
      btn.addEventListener('click', () => renderAbroadPanels(btn.dataset.tab));
    });
  }

  function carouselHTML(images, lang) {
    if (!images || !images.length) return '';
    const slides = images.map(img =>
      `<img src="${escHtml(img.src)}" alt="${escHtml(img.alt[lang])}" loading="lazy">`
    ).join('');
    const dots = images.length > 1
      ? `<div class="abroad-carousel__dots">
           ${images.map((_, i) => `<button class="abroad-carousel__dot${i === 0 ? ' abroad-carousel__dot--active' : ''}" aria-label="Snímek ${i + 1}"></button>`).join('')}
         </div>`
      : '';
    const btns = images.length > 1
      ? `<button class="abroad-carousel__btn abroad-carousel__btn--prev" aria-label="Předchozí">&#8249;</button>
         <button class="abroad-carousel__btn abroad-carousel__btn--next" aria-label="Další">&#8250;</button>`
      : '';
    return `<div class="abroad-carousel">
      <div class="abroad-carousel__track">${slides}</div>
      ${btns}${dots}
    </div>`;
  }

  function initCarousels() {
    document.querySelectorAll('.abroad-carousel').forEach(carousel => {
      const track = carousel.querySelector('.abroad-carousel__track');
      const dots  = Array.from(carousel.querySelectorAll('.abroad-carousel__dot'));
      const total = track.children.length;
      if (total < 2) return;
      let cur = 0;

      function goTo(idx) {
        cur = (idx + total) % total;
        track.style.transform = `translateX(-${cur * 100}%)`;
        dots.forEach((d, i) => d.classList.toggle('abroad-carousel__dot--active', i === cur));
      }

      carousel.querySelector('.abroad-carousel__btn--prev')
        .addEventListener('click', () => goTo(cur - 1));
      carousel.querySelector('.abroad-carousel__btn--next')
        .addEventListener('click', () => goTo(cur + 1));
      dots.forEach((d, i) => d.addEventListener('click', () => goTo(i)));
    });
  }

  function renderAbroadPanels(activeId) {
    renderAbroadTabs(activeId);
    const d    = destinations.find(x => x.id === activeId);
    const lang = isCs ? 'cs' : 'en';
    const factsHtml = d.facts[lang].map(f =>
      `<span class="abroad-fact">${escHtml(f)}</span>`).join('');
    const textsHtml = d.texts[lang].map(t =>
      `<p>${escHtml(t)}</p>`).join('');
    const hasImages = d.images && d.images.length > 0;

    document.getElementById('abroad-panels').innerHTML = `
      <div class="abroad-panel" id="panel-${d.id}" role="tabpanel">
        ${hasImages ? `
        <div class="two-col two-col--abroad">
          <div>${carouselHTML(d.images, lang)}</div>
          <div class="abroad-content">
            <p class="abroad-event">${escHtml(d.event[lang])}</p>
            <h3 class="abroad-title">${escHtml(d.title[lang])}</h3>
            <div class="abroad-texts">${textsHtml}</div>
            <div class="abroad-facts">${factsHtml}</div>
          </div>
        </div>` : `
        <div class="abroad-content abroad-content--full">
          <p class="abroad-event">${escHtml(d.event[lang])}</p>
          <h3 class="abroad-title">${escHtml(d.title[lang])}</h3>
          <div class="abroad-texts">${textsHtml}</div>
          <div class="abroad-facts">${factsHtml}</div>
        </div>`}
      </div>`;

    initCarousels();
  }

  renderAbroadPanels('belgie');

  // Projekty & Benefice

  document.getElementById('projects-h2').textContent      = isCs ? 'Projekty & Benefice' : 'Projects & Charity';
  document.getElementById('projects-lead').textContent    = isCs
    ? 'Hudbou rádi pomáháme tam, kde je to potřeba. Zároveň se zapojujeme do vzdělávacích a mezinárodních projektů, které přibližují klasickou hudbu širokému publiku.'
    : 'We love using music to help where it is needed. We also take part in educational and international projects that bring classical music to a wide audience.';

  const partnerLogos = [
    { src: 'assets/images/projects/clovek_v_tisni_logo.jpg',      alt: isCs ? 'Člověk v tísni'       : 'People in Need'        },
    { src: 'assets/images/projects/jeziskova_vnoucata_logo.jpg',   alt: isCs ? 'Ježíškova vnoučata'   : "Santa's Grandchildren"  },
    { src: 'assets/images/projects/KCF_logo.png',                  alt: isCs ? 'Klub CF'              : 'CF Club'               },
    { src: 'assets/images/projects/logo_nedoklubko.png',           alt: 'Nedoklubko'                                            },
  ];
  document.getElementById('partner-logos').innerHTML = partnerLogos
    .map(l => `<img src="${escHtml(l.src)}" alt="${escHtml(l.alt)}" class="partner-logo" loading="lazy">`)
    .join('');

  document.getElementById('btn-projects').textContent = isCs ? 'Všechny projekty' : 'All projects';

  initReveal();
})();
</script>
