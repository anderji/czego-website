<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O nás – CZEGO | Český kytarový orchestr</title>
  <meta name="description" content="Poznejte příběh Českého kytarového orchestru CZEGO. Téměř 30 hudebníků, dirigent Vladimír Novotný, zahraniční festivaly v Bangkoku, Hongkongu a Singapuru.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://czego.cz/o-nas.html">
  <link rel="alternate" hreflang="cs" href="https://czego.cz/o-nas.html">
  <link rel="alternate" hreflang="en" href="https://czego.cz/o-nas.html">
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="https://czego.cz/o-nas.html">
  <meta property="og:title"       content="O nás – CZEGO | Český kytarový orchestr">
  <meta property="og:description" content="Poznejte příběh Českého kytarového orchestru CZEGO.">
  <meta property="og:image"       content="https://czego.cz/assets/images/og/og-default.jpg">
  <meta property="og:site_name"   content="CZEGO">
  <meta name="twitter:card"       content="summary_large_image">
  <meta name="twitter:image"      content="https://czego.cz/assets/images/og/og-default.jpg">
  <meta name="theme-color"        content="#B8251A">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "AboutPage",
    "name": "O nás – CZEGO",
    "url": "https://czego.cz/o-nas.html",
    "description": "Poznejte příběh Českého kytarového orchestru CZEGO.",
    "isPartOf": { "@type": "WebSite", "url": "https://czego.cz" }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<a class="skip-nav" href="#main-content">Přeskočit na obsah</a>

<header class="site-header" role="banner">
  <div class="container">
    <nav class="nav" aria-label="Hlavní navigace">
      <a class="nav__logo" href="index.html">CZ<span>EGO</span></a>
      <button class="nav__burger" id="nav-burger" aria-label="Otevřít menu" aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav__links" id="nav-links" role="list"></ul>
    </nav>
  </div>
</header>

<main id="main-content" tabindex="-1">

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div class="container">
      <p class="eyebrow" id="ph-eyebrow"></p>
      <h1 id="ph-h1"></h1>
    </div>
  </div>

  <!-- PŘÍBĚH -->
  <section class="section" aria-labelledby="story-h2">
    <div class="container">
      <div class="two-col">
        <div class="reveal">
          <h2 id="story-h2"></h2>
          <p id="story-p1" style="margin-top:1.5rem"></p>
          <p id="story-p2"></p>
          <p id="story-p3"></p>
          <div style="margin-top:2rem">
            <a class="btn btn--primary" href="clenove.html" id="btn-members"></a>
          </div>
        </div>
        <div class="reveal reveal-delay-2">
          <div class="stats-row">
            <div class="stat">
              <div class="stat__num">~30</div>
              <div class="stat__label" id="stat-members"></div>
            </div>
            <div class="stat">
              <div class="stat__num">15+</div>
              <div class="stat__label" id="stat-years"></div>
            </div>
            <div class="stat">
              <div class="stat__num">8</div>
              <div class="stat__label" id="stat-countries"></div>
            </div>
            <div class="stat">
              <div class="stat__num">10+</div>
              <div class="stat__label" id="stat-concerts"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- CITÁT -->
  <section class="section section--alt">
    <div class="container container--narrow">
      <div class="quote-block reveal">
        <p class="quote-block__text" id="quote-text"></p>
        <cite class="quote-block__cite" id="quote-author"></cite>
      </div>
    </div>
  </section>

  <!-- ZAHRANIČÍ -->
  <section class="section section--sand" aria-labelledby="abroad-h2">
    <div class="container">
      <div class="section__header reveal">
        <p class="eyebrow" id="abroad-eyebrow"></p>
        <h2 id="abroad-h2"></h2>
        <p class="lead" id="abroad-lead"></p>
      </div>
      <div class="dest-list reveal">
        <span class="dest-tag">🇪🇺 <span id="dest-eu"></span></span>
        <span class="dest-tag">🇭🇰 Hongkong</span>
        <span class="dest-tag">🇸🇬 Singapur</span>
        <span class="dest-tag dest-tag--highlight">🇹🇭 Bangkok 2024</span>
      </div>
    </div>
  </section>

  <!-- BENEFICE -->
  <section class="section" aria-labelledby="charity-h2">
    <div class="container">
      <div class="two-col">
        <div class="reveal">
          <p class="eyebrow" id="charity-eyebrow"></p>
          <h2 id="charity-h2"></h2>
          <p id="charity-text" style="color:var(--text-secondary);line-height:1.8;font-size:.95rem"></p>
        </div>
        <div class="reveal reveal-delay-2">
          <div style="display:flex;flex-direction:column;gap:.75rem">
            <div style="display:flex;align-items:center;gap:1rem;padding:1rem;background:var(--cream);border-radius:var(--r-md);border:1px solid var(--border-light)">
              <span style="font-size:1.5rem">❤️</span>
              <span style="font-size:.9rem;color:var(--text-secondary)" id="org-nedoklubko"></span>
            </div>
            <div style="display:flex;align-items:center;gap:1rem;padding:1rem;background:var(--cream);border-radius:var(--r-md);border:1px solid var(--border-light)">
              <span style="font-size:1.5rem">🎸</span>
              <span style="font-size:.9rem;color:var(--text-secondary)" id="org-clotis"></span>
            </div>
            <div style="display:flex;align-items:center;gap:1rem;padding:1rem;background:var(--cream);border-radius:var(--r-md);border:1px solid var(--border-light)">
              <span style="font-size:1.5rem">🌊</span>
              <span style="font-size:.9rem;color:var(--text-secondary)" id="org-jesenik"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer" role="contentinfo">
  <div class="container" id="site-footer-inner"></div>
</footer>

<script src="assets/js/utils.js"></script>
<script>
(function () {
  const isCs = getLang() === 'cs';
  renderNav('o-nas.html');
  renderFooter();

  document.documentElement.lang = getLang();
  if (!isCs) {
    document.title = 'About – CZEGO | Czech Guitar Orchestra';
    document.querySelector('meta[name="description"]').content = 'Discover the story of the Czech Guitar Orchestra CZEGO. Nearly 30 musicians, conductor Vladimír Novotný, international festivals in Bangkok, Hong Kong and Singapore.';
  }

  // Page header
  document.getElementById('ph-eyebrow').textContent = isCs ? 'Kdo jsme' : 'Who we are';
  document.getElementById('ph-h1').textContent       = isCs ? 'Orchestr s duší' : 'An Orchestra with Soul';

  // Příběh
  document.getElementById('story-h2').textContent  = isCs ? 'Náš příběh' : 'Our Story';
  document.getElementById('story-p1').textContent  = isCs
    ? 'Jsme Český kytarový orchestr (dříve Pražský komorní kytarový orchestr) – téměř 30 kytarových nadšenců v čele s dirigentem Vladimírem Novotným.'
    : 'We are the Czech Guitar Orchestra (formerly the Prague Chamber Guitar Orchestra) – nearly 30 guitar enthusiasts led by conductor Vladimír Novotný.';
  document.getElementById('story-p2').textContent  = isCs
    ? 'Náš repertoár se skládá jak z klasické hudby, tak z filmových melodií a aranžmá na pomezí popu a swingu. Kromě hraní nás občas uvidíte i zpívat nebo hrát na perkusové nástroje.'
    : 'Our repertoire spans classical music, film scores, and arrangements on the border of pop and swing. Besides playing, you might sometimes see us singing or performing on percussion instruments.';
  document.getElementById('story-p3').textContent  = isCs
    ? 'Pravidelně se účastníme zahraničních festivalů a soutěží. Nejdál jsme byli v Hongkongu, Singapuru a v roce 2024 v Bangkoku.'
    : 'We regularly take part in international festivals and competitions. Our furthest tours have taken us to Hong Kong, Singapore, and Bangkok in 2024.';
  document.getElementById('btn-members').textContent = isCs ? 'Poznat členy' : 'Meet the members';

  // Stats
  document.getElementById('stat-members').textContent  = isCs ? 'Členů' : 'Members';
  document.getElementById('stat-years').textContent    = isCs ? 'Let' : 'Years';
  document.getElementById('stat-countries').textContent = isCs ? 'Zemí' : 'Countries';
  document.getElementById('stat-concerts').textContent  = isCs ? 'Koncertů ročně' : 'Concerts per year';

  // Citát
  document.getElementById('quote-text').textContent   = isCs
    ? 'Chtěla jsem poděkovat za nádherný koncert. Slyšely jsme ho poprvé a moc nás nadchl.'
    : 'I wanted to thank you for a wonderful concert. We heard you for the first time and were truly captivated.';
  document.getElementById('quote-author').textContent = isCs
    ? '— Návštěvnice Vánočního koncertu 2024'
    : '— Visitor at Christmas Concert 2024';

  // Zahraničí
  document.getElementById('abroad-eyebrow').textContent = isCs ? 'Svět' : 'The World';
  document.getElementById('abroad-h2').textContent      = isCs ? 'Zahraničí' : 'International';
  document.getElementById('abroad-lead').textContent    = isCs
    ? 'Pravidelně reprezentujeme českou orchestrální tradici na festivalech po Evropě i za oceánem.'
    : 'We regularly represent Czech orchestral tradition at festivals across Europe and beyond.';
  document.getElementById('dest-eu').textContent = isCs ? 'Evropa' : 'Europe';

  // Benefice
  document.getElementById('charity-eyebrow').textContent = isCs ? 'Pomáháme' : 'We Help';
  document.getElementById('charity-h2').textContent      = isCs ? 'Benefice' : 'Charity';
  document.getElementById('charity-text').textContent    = isCs
    ? 'Hudbou rádi pomáháme tam, kde je to potřeba. Podpořili jsme neziskové organizace Nedoklubko a Klub cystické fibrózy, uspořádali jsme koncert jako Ježíškova vnoučata a věnovali výtěžek ZUŠ Jeseník po povodních.'
    : 'We love using music to help where it is needed. We have supported Nedoklubko and the Cystic Fibrosis Club, performed as part of Santa\'s Grandchildren, and donated proceeds to Jeseník Art School after the floods.';
  document.getElementById('org-nedoklubko').textContent = isCs ? 'Nedoklubko & Klub cystické fibrózy' : 'Nedoklubko & Cystic Fibrosis Club';
  document.getElementById('org-clotis').textContent     = isCs ? 'Člověk v tísni – kytary do center' : 'People in Need – guitars for centres';
  document.getElementById('org-jesenik').textContent    = isCs ? 'ZUŠ Jeseník po povodních' : 'Jeseník Art School after floods';

  initReveal();
})();
</script>
</body>
</html>
